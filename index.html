:root { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--deep, #12080c); }
body {
  font-family: 'Philosopher', Georgia, 'Times New Roman', serif;
  color: var(--ink, #fff8f0);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  --u: 1; --u2: 1;
}
button { font: inherit; color: inherit; }

/* ───────── Canvas: the layout is drawn once at 1920×1080 and scaled to the screen ───────── */
body.tv-canvas { display: flex; align-items: center; justify-content: center; }
.screen {
  position: relative; width: 100%; padding: 18px 18px 28px;
  display: flex; flex-direction: column; gap: 20px;
  background:
    radial-gradient(ellipse 62% 70% at 100% 100%, var(--glow2), transparent 72%),
    radial-gradient(ellipse 80% 80% at 10% 0%, var(--glow), transparent 70%),
    var(--field);
}
body.tv-canvas .screen {
  flex: 0 0 auto; width: 1920px; height: 1080px; padding: 44px 64px 52px; gap: 30px;
  display: grid; grid-template-rows: 200px minmax(0, 1fr);
  transform-origin: center center;
}

/* ───────── Header: temple name, date, clock ───────── */
.header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 36px; }
.header .time { justify-self: center; }
.brand { display: flex; align-items: center; gap: 26px; min-width: 0; max-width: 600px; }
.crest { display: block; height: 120px; width: auto; flex: none; filter: drop-shadow(0 4px 14px rgba(0,0,0,.4)); }
.brand-name { font-size: 46px; line-height: 1.05; font-weight: 700; color: var(--ink); text-wrap: balance; }
.brand-place { margin-top: 6px; font-size: 30px; line-height: 1.1; color: var(--soft); }

.date-card {
  appearance: none; -webkit-appearance: none; cursor: pointer; text-align: center;
  padding: 14px 34px 16px; border-radius: 30px;
  border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.075);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14);
  transition: background .2s ease;
}
.date-card:hover { background: rgba(255,255,255,.13); }
.date-card:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 5px; }
.day-name { display: block; font-size: 44px; line-height: 1.05; font-weight: 700; color: var(--accent); }
.full-date { display: block; margin-top: 4px; font-size: 34px; line-height: 1.1; color: var(--ink); }

.time { display: flex; align-items: center; gap: 22px; }
.clock-hm { display: flex; align-items: baseline; font-size: 196px; line-height: 1; font-weight: 700; color: var(--ink); }
.clock-hm .d { display: inline-block; width: .6em; text-align: center; }
.clock-hm .d.ph { visibility: hidden; }
.clock-hm .c { display: inline-block; width: .3em; text-align: center; transition: opacity .25s ease; }
.time.off .c { opacity: .35; }
.clock-side { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 18px; }
.clock-sec {
  display: flex; align-items: center; justify-content: center;
  padding: 6px 16px 8px; border-radius: 999px;
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16);
  font-size: 48px; line-height: 1; font-weight: 700; color: var(--ink);
}
.clock-sec .d { display: inline-block; width: .6em; text-align: center; }
.clock-period { font-size: 64px; line-height: 1; font-weight: 700; color: var(--accent); }

/* ───────── Main: Today (70%) and Upcoming Event (30%) ───────── */
.main { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 3fr); column-gap: 36px; min-height: 0; }

.today {
  position: relative; min-height: 0; overflow: hidden;
  display: flex; flex-direction: column; padding: 40px 56px 0; border-radius: 56px;
  background: linear-gradient(180deg, rgba(255,255,255,.115), rgba(255,255,255,.05));
  border: 1px solid rgba(255,255,255,.15);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 40px 90px rgba(0,0,0,.3);
}
.today-title { flex: none; text-align: center; white-space: nowrap; font-size: 54px; line-height: 1; font-weight: 700; color: var(--accent); }
.today-events { flex: 1 1 auto; min-height: 0; margin-top: 8px; display: flex; flex-direction: column; overflow: hidden; }
.ev-list { width: 100%; margin: auto 0; }

.ev { text-align: center; padding: calc(12px * var(--u)) 0 calc(14px * var(--u)); }
.ev + .ev { border-top: 1px solid var(--hair); }
.ev-source, .cev-source {
  display: inline-block; padding: .12em .85em .2em; border-radius: 999px;
  background: rgba(255,255,255,.1); color: var(--accent-2); line-height: 1.15;
}
.ev-source { margin-bottom: calc(10px * var(--u)); font-size: calc(var(--s-note) * var(--u) * 1px); }
.ev-name { font-size: calc(var(--s-name) * var(--u) * 1px); line-height: 1.06; font-weight: 700; color: var(--ink); }
.ev-intro { margin: calc(10px * var(--u)) auto 0; max-width: 900px; font-size: calc(var(--s-note) * var(--u) * 1px); line-height: 1.25; color: var(--ink); }
.ev-time { margin-top: calc(8px * var(--u)); font-size: calc(var(--s-time) * var(--u) * 1px); line-height: 1.12; font-weight: 700; color: var(--accent); }
.ev-note { margin-top: calc(4px * var(--u)); font-size: calc(var(--s-note) * var(--u) * 1px); line-height: 1.2; color: var(--soft); }

/* The rotating shlok sits at the foot of the Today box */
.shlok-band {
  flex: none; height: 236px; margin: 0 -56px; padding: 0 64px;
  display: flex; align-items: center; justify-content: center; text-align: center;
  background: rgba(0,0,0,.16); border-top: 1px solid rgba(255,255,255,.1);
}
.shlok { width: 100%; transition: opacity .45s ease, transform .55s cubic-bezier(.22,.8,.22,1); }
.shlok.is-leaving { opacity: 0; transform: translateY(-10px); }
.shlok.is-entering { animation: shlokIn .8s cubic-bezier(.18,.82,.2,1) both; }
@keyframes shlokIn { 0% { opacity: 0; transform: translateY(16px); } 100% { opacity: 1; transform: none; } }
.shlok-box { height: 150px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.shlok-text { display: block; max-width: 100%; font-size: 40px; line-height: 1.26; color: var(--ink); }
.shlok-source { margin-top: 8px; font-size: 27px; line-height: 1.2; color: var(--accent-2); }

/* Upcoming Event(s): the next day in full, later days in brief, plus a festival countdown */
.coming {
  min-height: 0; display: flex; flex-direction: column; padding: 40px 40px 34px; border-radius: 44px;
  background: rgba(0,0,0,.26); border: 1px solid rgba(255,255,255,.09);
}
.coming-title {
  flex: none; align-self: flex-start; font-size: 46px; line-height: 1.1; font-weight: 700; color: var(--accent-2);
  text-decoration: underline; text-decoration-thickness: 4px; text-underline-offset: 12px;
}
.coming-days { flex: 1 1 auto; min-height: 0; margin-top: 34px; overflow: hidden; }
.cday-date { display: block; font-size: calc(42px * var(--u2)); line-height: 1.1; font-weight: 700; color: var(--ink); }
.cday-rel {
  display: inline-block; margin-top: calc(12px * var(--u2)); padding: .1em .75em .18em; border-radius: 999px;
  background: rgba(255,255,255,.12); font-size: calc(28px * var(--u2)); line-height: 1.15; color: var(--accent);
}
.cday + .cday { margin-top: calc(30px * var(--u2)); padding-top: calc(26px * var(--u2)); border-top: 1px solid var(--hair); }
.cev { margin-top: calc(26px * var(--u2)); }
.cev + .cev { margin-top: calc(24px * var(--u2)); padding-top: calc(22px * var(--u2)); border-top: 1px solid var(--hair); }
.cev-source { margin-bottom: calc(8px * var(--u2)); font-size: calc(26px * var(--u2)); }
.cev-name { font-size: calc(56px * var(--u2)); line-height: 1.07; font-weight: 700; color: var(--ink); }
.brief .cev-name { font-size: calc(38px * var(--u2)); }
.cev-time { margin-top: calc(6px * var(--u2)); font-size: calc(36px * var(--u2)); line-height: 1.12; font-weight: 700; color: var(--accent); }
.cev-note { margin-top: calc(4px * var(--u2)); font-size: calc(28px * var(--u2)); line-height: 1.2; color: var(--soft); }
.coming-empty { font-size: 36px; line-height: 1.25; color: var(--soft); }
.fest {
  flex: none; margin-top: 18px; padding: 22px 26px 24px; border-radius: 30px; text-align: center;
  background: linear-gradient(160deg, var(--daily-wash-a), var(--daily-wash-b)), rgba(255,255,255,.06);
  border: 1px solid var(--line);
}
.fest[hidden] { display: none; }
.fest-label { display: block; font-size: 24px; line-height: 1.2; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-2); }
.fest-name { display: block; margin-top: 6px; font-size: 50px; line-height: 1.08; font-weight: 700; color: var(--ink); }
.fest-days { display: block; margin-top: 8px; font-size: 30px; line-height: 1.2; color: var(--soft); }
.fest-days b { font-size: 58px; line-height: 1; color: var(--accent); }
.ev-quote {
  margin: calc(18px * var(--u)) auto calc(6px * var(--u)); max-width: 1000px;
  text-align: center; font-size: calc(var(--s-note) * var(--u) * 1.05px); line-height: 1.3; font-style: italic; color: var(--accent-2);
}
/* Later days in the Upcoming panel: one compact row each */
.cday.brief + .cday, .cday + .cday.brief { margin-top: calc(22px * var(--u2)); padding-top: calc(18px * var(--u2)); }
.brief .cday-date { display: inline; font-size: calc(30px * var(--u2)); }
.brief .cday-rel { margin: 0 0 0 calc(10px * var(--u2)); vertical-align: .15em; font-size: calc(22px * var(--u2)); }
.brief .cev { margin-top: calc(8px * var(--u2)); }
.brief .cev + .cev { margin-top: calc(4px * var(--u2)); padding-top: 0; border-top: 0; }
.brief .cev-time { font-size: calc(28px * var(--u2)); }

/* ───────── Phones held upright: stack everything ───────── */
@media (max-width: 1200px) and (orientation: portrait) {
  html, body { height: auto; min-height: 100%; overflow: auto; }

/* Preview studio: opened by clicking the date card. Lives outside the scaled TV canvas,

  .pv-overlay {

    background:rgba(3,3,6,.64);

  .pv-body { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); }

  .pv-day {

  .pv-legend { display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:16px; color:var(--muted); font-size:12.5px; }

  .pv-detail { min-width:0; padding:20px 24px; display:flex; flex-direction:column; gap:16px; }

  .pv-mini-main { flex:1; display:flex; gap:3px; min-height:0; }

  .pv-mini-up { flex:3; border-radius:3px; }
  .pv-mini-line { width:62%; height:3px; border-radius:2px; background:rgba(255,250,242,.85); }
  .pv-mini-line.is-muted { width:44%; opacity:.35; }
  .pv-theme { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:14px; border:1px solid rgba(255,255,255,.07); background:rgba(255,255,255,.035); }
  .pv-swatches { display:flex; padding-left:6px; }

  .pv-theme-name { display:block; font-size:15px; font-weight:700; }
  .pv-theme-sub { display:block; color:var(--muted); font-size:12px; opacity:.85; }
  .pv-section-label {
    display:flex; align-items:center; gap:10px; margin-bottom:8px;
    color:var(--muted); font-size:11.5px; letter-spacing:2px; text-transform:uppercase; font-weight:700;
  }

  /* Floating control bar shown only while a preview date is active. */
  .pv-bar {

  .pv-badge {

  .screen.pv-swap .main, .screen.pv-swap .date-card { animation:pvSwap .5s cubic-bezier(.2,.8,.2,1); }

  @media (max-width:760px) {

/* Preview studio: neutral glass so the day's colour only accents it */

<div class="screen">

const DAILY_SHLOKS = [
  {"number": 1, "text": "I meditate, within my heart, upon Lord Shree Krishna, whose left Radha is standing by, on whose right chest resides Lakshmi and who enjoyed his own divine sports at Brindavana (with Radha and Lakshmi)."},
  {"number": 2, "text": "He writes further. I, Sahajananda Swami, staying at Vrittalaya (Vadatal) write this SHIKSHAPATRI to all my followers living in different countries. (Vrittalaya means a place of good conduct)"},
  {"number": "3–6", "text": "Ayodhyaprasada, the son of my brother Rampratapa and grand son of Dharmadeo my father and Raghuvira, the son of my brother Ichchharama and grand son of Dharmadeo my father, brahmacharies who are life long celibates and who are headed by Mukundananda, house holders such as Mayarama Bhatta and others who are my followers, married-women with husbands alive, widows, unmarried women who have become my followers, and all Sadhus headed by Muktananda are all my disciples. And in accordance with Shastras, I, remembering Shree Narayana, bestow my best blessings to all the above mentioned disciples so that the blessings may help them in following and keeping their Swadharma (One’s religious duties)."},
  {"number": 7, "text": "All my disciples shall study with full concentration of mind, this SHIKSHAPATRI which is written with a definite purpose of doing good to all living beings."},
  {"number": 8, "text": "Those who follow through out their life time the rules of good conduct as enjoined by the Holy Scriptures will lead a blissful life in this world and in the next."},
  {"number": 9, "text": "And those, the morally depraved persons who cross the precincts of good conduct and behave as free thinkers will suffer great distress in this world and in the next."},
  {"number": 10, "text": "So, all my disciple, shall lead their life, only by following these precepts with willingness and vigilance through-out their life"},
  {"number": 11, "text": "My disciples shall never kill or harm deliberately any living being in this world though they are negligible tiny insects such as lice and bugs."},
  {"number": 12, "text": "None of my follower shall kill or harm goats or other animals even for the sacrificial ceremonies to propitiate a deity of manes (Spirits of fore fathers) because the Shastras assert that non-violence alone is the best form of Dharma"},
  {"number": 13, "text": "None shall ever use violence against any person as to gain something such as woman, wealth and even an empire."},
  {"number": 14, "text": "None shall commit suicide even at a place of pilgrimage out of super-stition or out of anger frustration caused by some unworthy behaviour, or by consuming poison or by stran-gulation or by drowning."},
  {"number": 15, "text": "Flesh in any form shall not be eaten even though it is a remnant of offering in a sacrifice, and liquor or alcohol shall not be taken, though it is offered to a deity."},
  {"number": 16, "text": "One may commit any misdeed against the other, or may come under the spell of the rage, still no one shall cut or harm, with any instrument any part of his own body or of the others"},
  {"number": 17, "text": "One shall not steal other’s property even for religious or benevolent purposes; and shall not take even a small stick or flowers etc. (even for offering to deities) without the permission of the owner."},
  {"number": 18, "text": "My followers, male or female shall not commit adultery. They shall not take to gambling or other games with stakes. Also they shall not consume intoxicants such as hashish."},
  {"number": 19, "text": "Accepting water or cooked food from the people of some category is forbidden by scriptures. My follower shall not accept it even if it happens to be an offering to Lord Krishna. But the same can be accepted if it is an offering to lord Jagannatha in Jagannathpuri."},
  {"number": 20, "text": "None shall ever impute false charges to anybody, even for the sake of self interest, and nor at any time shall use abusive and indecent words."},
  {"number": 21, "text": "No one shall use or beat any abusive or indecent words against Gods, Brahmins, the holy places, chaste women, the holy Vedas or the holy persons and never shall hear those words if uttered by any-one."},
  {"number": 22, "text": "None shall accept any thing, even vegetarian food offered to deity before whom, offerings of wine, flesh etc. are made and before whom animals like goats are slaughtered as a part of sacrifice"},
  {"number": 23, "text": "When my followers see temples of Lord Shiva or other deities, on the way, they shall bow down with reverence and have “Darshan” of them."},
  {"number": 24, "text": "None shall discard his duties which he has to perform as a member of particular caste and none shall indulge in doing the duties assigned to member of an other caste, likewise no member of the order (of life) shall discard his duties which he must perform as a member of a particular order and none shall indulge in doing the duties assigned to the member of the other order. (Ashrama) And none shall follow (the religion propounded by the religious impostors) the religion which is not Vedic."},
  {"number": 25, "text": "None shall listen to religious discourses or narrations or stories (even the divine stories) of God from a person whose speech may lead to a fall from the path of devotion to God or from one’s religious duties."},
  {"number": 26, "text": "On shall not utter even a truth if it betrays him or others. And one shall not associate himself with ungrateful per-son and never take bribe from anyone."},
  {"number": 27, "text": "None shall associate himself with thieves, sinners, religious impostors, hypocrites, libidinous persons or the addicts."},
  {"number": 28, "text": "None shall associate himself with those persons, who under pretext of preaching religion or devotion to God, seek wealth, women and worldly pleasures and commit sins."},
  {"number": 29, "text": "Never follow those scriptures which by mere logic, deny God and his incarnations."},
  {"number": 30, "text": "None shall ever take water or milk unfiltered and use impure or contaminated water for bathing or any other purpose."},
  {"number": 31, "text": "None shall ever take medicine which contains fat or alcohol, and which is prescribed by a physician whose conduct and character is unknown."},
  {"number": 32, "text": "None shall ever excrete, urinate, or spit at the places prohibited by the public or by the scriptures."},
  {"number": 33, "text": "None shall enter or leave a place through a back – door way and shall not live in a place without the permission of its owner."},
  {"number": 34, "text": "Male shall not listen to female delivering discourse or narrating the divine stories of Gods and none shall enter into discussions with a female or a ruler or with his associates."},
  {"number": 35, "text": "None shall show disrespect to the preceptors, superiors, the popular persons, scholars and to those armed with weapons."},
  {"number": 36, "text": "Nothing shall be done in haste (without thinking over it). But (Dharma) virtuous deeds shall be done without hesitation, and one shall impart his knowledge to others. Everyone shall associate himself always with the men of good conduct and characters."},

  {"number": 47, "text": "Shree Narayana and Lord Shiva shall be looked upon as the same and one identity, as the Vedas proclaim both of them as Brahman."},
  {"number": 48, "text": "Our ancient scriptures grant exemptions from performing the religious rites and rituals only for the period of abnormal conditions and suggest alternatives also. These are called “Apad Dharma” My disciples shall not take them as granted, also for a period of tolerable difficulties."},
  {"number": "49–54", "text": "Daily rituals common for all: All my followers shall wake up early in the morning before sunrise; meditate on Lord Krishna for a while; attend to the call of nature and brush their teeth sitting in a clean place; take a bath with clean water; and put on two washed, clean clothes. Then, sitting on a separate mat spread on a cleanly sanctified floor and facing east or north, they shall perform Achaman (sipping a few drops of water thrice, a purifying act performed at the beginning of every religious ceremony). The males shall make a U-shaped mark on the forehead with the round dot in it. Women whose husbands are alive shall make a red dot on the forehead with Kumkum. A widow shall make neither the U mark nor the red dot on her forehead. Then all males and females shall offer mental worship to Shree Krishna. They shall bow down with devotion before the idol or picture of Radha-Krishna and chant the Krishna Mantra as far as their time allows. Then they may attend to their secular duties."},
  {"number": 55, "text": "My disciples who are Atma Nivedies and devotees like the king Ambarisha shall perform their daily rituals and Poojas in the above mentioned order up to the mental worship. (Refer stanza 49 to 53)"},
  {"number": 56, "text": "After the mental worship, the Atma Nivedies shall perform Pooja to an idol made of either stone, metal or to a Shalagrama, (a holy black stone) with leaves or flowers etc. that are easily available to them. Then they shall chant the Krishna Mantra of eight syllables."},
  {"number": 57, "text": "Then, they shall recite hymns of Shree Krishna as much as they know. Those who do not know Sanskrit prayers shall repeatedly chant the divine names of Shree Krishna."},
  {"number": 58, "text": "After that, they shall offer food to the icon of Shree Krishna (Place the food before the idol) and take only that food that is offered to him. Thus they shall lead a life always with the contentment and with the aim of dedicated service to God"},
  {"number": 59, "text": "The Atma Nivedics are callad as ‘Nirguna’ devoteese because all their actions become ‘Nirguna.’ (Without mundane qualities) as they are surendered to the God who is ever ‘Nirguna.’ (Without mundane qualities)"},
  {"number": 60, "text": "These Atma Nivedies devotees shall not consume even leaves, nuts, fruits or water without offering the same to Shree Krishna."},
  {"number": 61, "text": "All my devotees (initiated into ordinary Deeksha or special Deeksha) who are unable to perform Poojas to the icon of Shree Krishna due to old age, illness or any other discomfiture shall hand over the icon to another able devotee and be quite contented with performing mental Pooja."},
  {"number": 62, "text": "My devotees shall offer Poojas to only those objects that are in the form of God Shree Krishna which are sanctified and given to them by the Acharyas. (Descendants of Dharmadeo And in the case of other idols or objects, they shall kneel before them with reverence and devotion."},
  {"number": 63, "text": "All my followers shall go to the temple of Shree Krishna every evening and sing and chant the names of Shree Krishna loudly."},
  {"number": 64, "text": "They shall narrate or listen to the divine stories of Shree Krishna with great reverence and on festival days, they shall sing songs in praise of him accompanied by musical instruments."},
  {"number": 65, "text": "All my followers shall follow the course of daily routine as instructed in the previous stanza and also shall study the sacred scriptures written in sanskrit or vernacular as much as they can learn."},
  {"number": 66, "text": "My disciples shall think over about one’s merits and competence before assigning him any work. A person shall be assigned a job for which he is suited to and never engage a person unsuited for the job."},
  {"number": 67, "text": "My disciples shall take care of their servants by providing them sufficient food, clothes and other necessities. The wage shall be decided according to the work completed by the employee and the financial position of the employers."},
  {"number": 68, "text": "While talking to others, my followers shall consider the time, place and the status of the person to whom they talk and shall use such a language proper for the occasion, and never otherwise."},
  {"number": 69, "text": "My followers shall honour and pay respects with humility by rising from their seat and offering proper seat, water etc. to the visiting elders such as teacher, king, old man, recluse, scholar and hermit."},
  {"number": 70, "text": "No one shall sit in a posture with one foot placed on the thigh or with both knees bound with a cloth strap, in the presence of teacher, king and an idol of God or in the assembly."},
  {"number": 71, "text": "My disciples shall never enter into arguments with their Acharyas. But they shall perform Pooja to the Acharya by offering him food, money, clothes etc. according to their means."},
  {"number": 72, "text": "On hearing the news of Acharya’s visit, my followers shall proceed to welcome him at the entrance of the village and on his departure shall accompany him to the outskirts of the village to bid farewell."},
  {"number": 73, "text": "My follower shall not indulge in acts which are contrary to the scriptural tenets, however fruitful they may be, for one’s Swadharma alone can yield all the desired results."},
  {"number": 74, "text": "My devotees shall follow only the virtuous deeds of the great persons of the past, ignoring their unrighteous deeds."},
  {"number": 75, "text": "My devotees shall never disclose the secrets of others to any one. They shall give due respects to the deserving persons (on the basis of birth, quality, qualification, culture and so on) without equating the low with the high."},
  {"number": 76, "text": "All my disciples shall take a vow to observe additional austerity during the four month of monsoon (beginning from the eleventh day of bright half of Ashade month and ending on the twelfth day of the bright half of Kartika month) and those who are unable to do so, may observe it at least during the month of Shravana."},
  {"number": "77–78", "text": "The following are the best methods of observance to be adopted and followed daily as rules:- (1) Reading or listening to the divine stories of Shree Bhagwan. (2) Singing in praise of his divine qualities. (3) Performing Poojas on grand scale. (4) Repeating his mantra. (5) Reading the books of his Stotra (praise). (6) Going round his icon or image"},
  {"number": 79, "text": "They shall earnestly observe fast on all the EKADASHI days (the eleventh day of every lunar half month), JANMASHTAMI (birthday of Shree Krishna) and Shivratri. They shall also celebrate these days with great festivity."},
  {"number": 80, "text": "On the days of fasting, sleeping in day time shall be avoided as that will make the fast purposeless as is the case with the conjugal enjoyment on these days."},
  {"number": "81–82", "text": "On the question of deciding the dates (days) of fasting, festivals and on the customs of daily service (in the temple ) to Shree Krishna, my disciples shall follow the decisions already made by Shree Vithalnathji, the son of Vallabhacharya, the Acharya of Vaishnavas. (For details refer to the SATSANGI JEEVANNA chapter 4th canto 55-62."},
  {"number": 83, "text": "They shall go on pilgrimage to holy places like Dwarika, perform there the due religious rites as prescribed by the scriptures and show benevolence towards the poor as far as possible."},
  {"number": 84, "text": "My disciples shall hold in great reverence all the five Gods namely Vishnu, Siva, Ganapati, Godess Parvati and Surya (sun)."},
  {"number": 85, "text": "In the event of afflictions caused by any evil spirit, my followers shall chant the Stotra of NARAYANA KAVACHAM or HANUMAN STOTRAM, but shall never chant Mantras of other deities of lower stature."},
  {"number": 86, "text": "On the occurrence of lunar or solar eclipse, all shall suspend their daily routines immediately, take bath, make them selves pure, and chant the Mantra of Shree Krishna repeatedly."},
  {"number": 87, "text": "When the eclipse is over, they shall bath with their clothes on. Then, the householders (Grihasthas) shall give alms to the poor according to their means and others (non householders) shall offer Poojas to the deities."},
  {"number": 88, "text": "All the four castes shall observe the ceremonial defilement (SOOTAK) owing to the birth or death of their relatives, for certain days as prescribed by the scripture."},
  {"number": 89, "text": "My Brahmin devotees shall cultivate the qualities of tranquillity, self-restraint, forbearance, content-ment and the like. The Kshatriyas shall cultivate the qualities of valour, fortitude, generosity etc."},
  {"number": 90, "text": "The Vaisya caste shall take to agriculture, trade, banking etc., and the Sudras shall do service to the above three communities."},
  {"number": 91, "text": "The twice born people (the Brahmins, the Kshatriyas, and the Vaisya) shall perform the sixteen “Samskars,” the daily rites and rituals and the Shraddha (ceremonies for the dead) at the prescribed time following the methods mentioned in their respective Grihya Sutras, spending within the limits of their means."},
  {"number": 92, "text": "If at all my followers happen to commit any sin, serious or negligible, willingly or unwillingly, they stay shall perform the expiatory rituals for the sins within the limits of their means and ability."},
  {"number": "93–95", "text": "I hold the following eight scriptures as superior and true authority on our philosophy and religion, (Sat-Shastras). The Vedas, the Brahmasutra of Vyas, Shree Bhagvata Purana, the Vishnu Sahasranama, Shreemad Bhagavad Gita, the Neeti narrated by Vidura (all the three from Mahabharata) Shree Vasudeva Mahatmiyam from Vaishnava canto of Skanda Purana and Yagnyavalkya Smriti among Dharma Shastras."},
  {"number": 96, "text": "The twice born people (who got the sixteen Samskaras done according to their Grihya Sutra) shall study, preach and propagate all the above said Sat – Shastras. And all my disciples wishing their own well being shall listen to these preachings."},
  {"number": 97, "text": "Amongst the above scriptures, my follower shall hold the Yagnyavalkya Smriti supported by Mitakshara(Commentary)astheguidingauthority in deciding the issues arising over the subjects of the daily routines of rites and rituals, the secular business affairs and the penance or expiation."},
  {"number": 98, "text": "The fifth and tenth canto of Shree Bhagvata Purana shall be regarded as best among these scriptures for clear understanding of the greatness and glory of Shree Krishna."},
  {"number": 99, "text": "I hold that the tenth and fifth cantos of Shreemad Bhagavata Purana are Bhakti Shastra and Yoga Shastra respectively, and the Yagnyavalkya Smriti is Dharma Shastra."},
  {"number": 100, "text": "It should be kept in mind that the commentaries on Vyasa Sutra (Vedanta Sutra) and Bhagavad Gita both by Shree Ramanujacharya are accepted by me as the sole authority on my philosophical and spiritual decisions."},
  {"number": "101–102", "text": "In the Scriptures above mentioned, those portions which describe glory of Shree Krishna and greatness of Dharma (religious duty), Bhakti (devotion to God), Vairagya (asceticism), should be regarded more important than the other portions. The essence of those portions is that one shall practice devotion to God and at the same time shall perform one’s religious duties also."},
  {"number": 103, "text": "“Dharma shall be known as the actions of persons according to their Varna and Ashrama enjoined by the Shruties (Vedas) and Smriti (like Manusmriti, Yagnyavalkya Smriti etc.) Bhakti (devotion) shall be known as the limitless love to “MADHAVA” Shree Krishna combined with the realisation of His glory."},
  {"number": 104, "text": "“Vairagya” (renunciation) means the detachment from the world except Shree Krishna. And knowledge means the clean understanding of the characteristic features of the JEEVA (self), the MAYA (matter), and the EASWARA (God)."},
  {"number": 105, "text": "Jeeva is ‘self’ (it is called Jeevatma also.) He is the knower (in function), knowledge (in material), indivisible part of an atom (in size), abstract (in appearance) and non-resistant (in nature). He resides in the main controlling part of the body and pervades it through the force of his knowledge. He is described as formless; shapeless, changeless and eternal one, who can never be destroyed by any means at any time."},
  {"number": 106, "text": "Maya is the force of God which is a combination of three qualities (Satwa, Rajas and Tamas)) of matter; but generally called as ‘Tamas and which causes the psychological bond between the Jeevatma and his body as well as Jeevatma and the world through the body. And it is he main cause ‘mine’ (this is mine)."},
  {"number": 107, "text": "Easa or Easwara is the God, who as an immanent and independent controller, is present in the Jeeva, like Jeeva is in the body, and who reward the Jeevas, the fruits of all their activities*. (*Karma, either good or bad.)"},
  {"number": 108, "text": "And, that God is Shree Krishna. He is called as the Prama-Brahman. He is called as Bhagwan, and Purushottama. He is the cause of all creations and incarnations. He is our beloved God. He is the object of our contemplation or meditation."},
  {"number": "109–110", "text": "He shall be known as Radhakrishna when he is accompanied by Radha. He shall be known as ‘Lakshmi-Narayana’, when accom-panied by Rukmani or Lakshmi. He shall be known as Nara Narayana when associated with Arjuna. (And as Rama Krishna, when associated with Balarama.)"},
  {"number": 111, "text": "At times Radha and others (mentioned above) may be seen by the side of Shree Krishna, and sometimes they are absorbed in Him due to extreme love. Then He shall be considered one single unit."},
  {"number": 112, "text": "Therefore, no one shall misunderstand that Shree Krishna is different from Narayana, Rama-Krishna or Radha-Krishna. He, at His will, appears sometimes with two arms and at times with four or with many."},
  {"number": 113, "text": "All the people on this earth shall pursue the devotion to Shree Krishna and to Shree Krishna alone. It should be kept in mind that there is no other way for ultimate as salvation than the devotion to Him. (Refer the note given to the Sloka No.47.)"},
  {"number": 114, "text": "The supreme aim of having good virtues is to pursue the divine devotion to Shree Krishna and to have the good company of His devotees. If this goal is not achieved, even scholars will meet their fate."},
  {"number": 115, "text": "My devotees shall offer worship only to Shree Krishna and His incarna-tions as well as His images. And never shall offer worship to any Jeeva though they may be Devas or great devotee or seer of Brahman."},
  {"number": 116, "text": "Through meditation or Yoga, my devotees shall distinguish the Jeeva from the three sorts of his external bodies (the Sthula, Sukshma and Karana Sareeras) and enjoy his distinctive qualities. Then they will realise that the Self is the Rupam of Brahman (form or body of Brahman). After this achievement, they shall always concentrate their mind in Bhakti Yoga."},
  {"number": 117, "text": "All shall listen with reverence to the tenth canto of Shreemad Bhagavata daily or at least once a year. And the scholars shall read and deliver discourse every day or at least once a year."},
  {"number": 118, "text": "According to their means, my devotees shall arrange for the holy recitation of the tenth canto of Shreemad Bhagavata, Vishnu Sahasranama or the holy scriptures mentioned previously, by holy Brahmins at holy places. This will yield the desired results."},
  {"number": 119, "text": "(Religious rules as modified for practice in difficult times – Refer Sloka no.48) They shall follow these rules of conduct in such a way as to protect themselves and others from illness or any difficulty that may be faced due to human error or by providence. They shall be never careless."},
  {"number": 120, "text": "They shall take into consideration the place, time, their cast, age, financial condition and capacity, when they practice their religious duties, the expiation and code of secular conduct."},
  {"number": 121, "text": "All my disciples shall understand that my school of Vedanta is VISHISHTADWAITA of Shree Ramanuja and my beloved adobe is GOLOKDHAMA and the MUKTI one shall desire is to get the divine body in the Dhama just like that of Brahman and to render service to God Shree Krishna."},
  {"number": 122, "text": "The code of religious conduct so far described in common for all my disciples both males and females. Now I shall tell some special codes of conduct for distinctive groups."},
  {"number": 123, "text": "Codes of conduct given to Acharyas of the Sect:- The two sons (Shree Ayodhyaprasadaji Maharaja and Raghuviraji Maharaja) of my elder and younger brother respectively shall not give Mantras or initiation to women who are not closely related to them."},
  {"number": 124, "text": "They (Acharyas born in my family who are religious and spiritual heads of my Sect) shall neither touch nor converse with such women (as mentioned above). They shall never be cruel to anyone and shall not keep under their custody anything mortgaged or deposited on trust."},
  {"number": 125, "text": "They shall not stand as surity for any one in social or legal dealings. In the event of financial crises they may live on charity and shall never incur debts."},
  {"number": 126, "text": "They shall not sell the food grains offered to them by their disciples. But may exchange them for it does not amount to sell."},
  {"number": 127, "text": "They shall offer worship to Lord Shree Ganesha on the fourth day of the bright half of the month Bhadrapada (bhadarvo) and to Shree Hanumanji on the fourteenth day of the dark half of the month Ashwin (asho) every year."},
  {"number": 128, "text": "I have enthroned both of them with a view to protect and preserve our religion. They shall initiate those disciples who are desirous of salvation. (Mukti)."},
  {"number": 129, "text": "They shall maintain discipline among the disciples and see that they follow the precepts accordingly and perform their religious duties within their precincts. They shall honour the saints and shall study the Vedas and Shastras with reverence."},
  {"number": 130, "text": "They shall render and keep up worship and service as mentioned in the shastras to the deities such as Shree Lakshmi Narayana and others installed by me in the temples big or small. (See BHASYA under the Sloka.)"},
  {"number": 131, "text": "Any one coming to the temple seeking food shall be treated by them with respect by offering him food to the best of their capacity."},
  {"number": 132, "text": "Theyshallestablish“PATHASHALAS” (Educational institution) and appoint Brahmin Scholars in them, to propagate Vedas and Shastras which are called here as Sat-Vidhaya. This is the act of greatest piety."},
  {"number": 133, "text": "Special code of conduct for the wife of Acharya:- And the consort of the Acharya, with the permission of her husband shall give the Mantra of Shree Krishna, to women only. (133)."},
  {"number": 134, "text": "She shall not touch, speak to, or show her face to any man who has no nearest blood relation."},
  {"number": 135, "text": "The Grihasthas (House-holders) among my disciples shall not touch any widow who has no thick relationship with them."},
  {"number": 136, "text": "They shall never stay in a secluded place, even with their mother, sister or daughter, who are of young age except in emergencies and shall never give away their wives in alms to any body."},
  {"number": 137, "text": "They shall never have any contact with a woman who has connection with a ruler for known or unknown reasons."},
  {"number": 138, "text": "They shall receive the guests who come to their house and offer them food etc. with hospitality as far as they can. And they shall offer Poojas to gods and shraddha* to the ancestors (parents and grand parents dead) as prescribed in the Shastras."},
  {"number": 139, "text": "As far as possible, my disciples shall attend to their mother, father, preceptor and a sick person and render service with proper care and nursing as they live."},
  {"number": 140, "text": "As far as possible they shall engage themselves in such occupation suited to their cast (varna) and mode of life (Ashrama).Those who are farmers shall not engage in castration of a bull."},
  {"number": 141, "text": "They shall, at proper seasons save and store money and food-grains sufficient to their future requirements, according to their ability. Those who own cattle shall store sufficient stock of fodder also."},
  {"number": 142, "text": "The householders may keep cows and other cattle only if they can afford to look after them well by feeding them with fodder; water etc. properly, otherwise they shall not keep them."},
  {"number": 143, "text": "Without a written record, signed by witness, my disciples shall not enter in business transactions such as sale or purchase of property, lending or borrowing money, with any person, even with son or a friend."},
  {"number": 144, "text": "Whenever they enter into marriage agreements, they shall not depend on mere oral assurances regarding the amount payable to either party, but shall make a written record signed by witness."},
  {"number": 145, "text": "They shall always spend only within the limit of their income. They shall keep it in mind clearly that non-adherence to this policy will lead to distress."},
  {"number": 146, "text": "After clearly recollecting the daily income and expenditures they shall record it in a diary and maintain proper accounts."},
  {"number": 147, "text": "They shall offer to Shree Krishna one tenth of the income received through their occupations. Househol-ders with limited sources of income may offer one twentieth of it."},
  {"number": 148, "text": "They shall accomplish all the religious ceremonies such as observing fast on Ekadashi and the like ones, as prescribed in the Shastras, to the best of their ability as this will fulfil all their wishes."},
  {"number": 149, "text": "During the month of Shravana, they shall perform or arrange to perform Pooja with devotion to Lord Mahadeva (Shiva) at any cost by offering Bilva leaves and flowers."},
  {"number": 150, "text": "They shall not borrow money from their Acharya or from the temple of Lord Shree Krishna nor shall they borrow from them any utensils, ornaments or garments or such other things for their personal use."},
  {"number": 151, "text": "While going on a pilgrimage to worship Lord Krishna or to a saint or a preceptor, they shall not accept food offered by others either on the way or at those places, because such acts take away the fruits of our good deeds (Punya) i.e. the sacredness of the pilgrimage."},
  {"number": 152, "text": "One shall pay the labourer, the proper remuneration as promised, (of course after the completion of the given work) and shall not conceal the matters regarding clearing of debt, marriage-connections, or pedigree etc. Also shall not have dealings with the wicked."},
  {"number": "153–154", "text": "In the event of famine, harassment by enemies or rulers, which may result in loss of dignity, loss of property or life, my disciples shall be so discreet as to quit even their native place and migrate to other places where they can live comfortably."},
  {"number": 155, "text": "Those house-holders who are quite well to do shall perform non-violent Vaishnava sacrifices (Yagnas) (where no killing of animal is involved). They shall feed the Brahmins and ascetics in places of pilgrimage and also in auspicious days."},
  {"number": 156, "text": "They shall also arrange to celebrate festivals on grand scales in the temples and shall offer various things in charity to deserving Brahmins."},
  {"number": 157, "text": "Those rulers who are my followers shall protect their subjects just as they would do their children in conformity with the tenets of Dharma Shastras (Holy Scriptures) and they shall establish the rule of Dharma on the earth."},
  {"number": 158, "text": "The rulers shall acquire perfect knowledge of: 1. The seven constituent parts of the state, 2. The four expedient devices, 3. The six aspects of diplomacy. They shall also study and understand (through spies) the nature of bureaucrats appointed in various posts in their kingdom. They shall appoint persons who well-versed in the art of state crafts as ministers and shall be able to identify by their characteristics, the persons who deserve to be punished and those who do not deserve to be punished."},
  {"number": 159, "text": "Female whose husband is alive shall render service to her husband taking him as her God and shall never use harsh words against him, though he is blind, sick or impotent or poor."},
  {"number": 160, "text": "She shall never have acquaintance even casually,withanyhandsomeyoungman(otherthan the husband) even though he may be a man of good character."},
  {"number": 161, "text": "The devout housewife shall never keep her body without an upper garment and shall not dress in such a way that may expose her navel, thighs or breast to the viewers. She shall not look at persons of mimical nature and never make acquaintance with a woman who knows no modesty."},
  {"number": 162, "text": "Putting on luxurious dress of ornaments, staying in the house of others and merriment even with ladies shall be avoided while her husband is staying away in a far off land."},
  {"number": 163, "text": "Widows shall render service to God taking him in the place of her husband and live with their father, brothers or sons render their care. They shall never live independent ladies."},
  {"number": 164, "text": "They shall never touch any male who has no nearest blood relation. Young widows shall never speak to young men without utter necessity. 164"},
  {"number": 165, "text": "Touching any male child is harmless as touching a cattle and touching or talking to old man is equally harmless, if it is inevitable. 165"},
  {"number": 166, "text": "Even learning good things from a man who has no nearest blood relation with her, is to be avoided. The widows shall exercise control over their body and senses by frequent observance of fasts and austerities."},
  {"number": 167, "text": "The wealth kept by the widows for livelihood shall not be spent even for philanthropic use. She shall give only if she possesses more."},
  {"number": 168, "text": "They shall take food once a day and sleep on the floor. They shall never look at even animals at their sexy cohabitation."},
  {"number": 169, "text": "They shall never dress as married woman or like a nun or a female, recluse. They shall never put on an immodest dress."},
  {"number": 170, "text": "They shall neither keep friendship with, nor touch those ladies who incline abortion. And never talk or listen to the amorous talks of males."},
  {"number": 171, "text": "Except under critical conditions, a widow who is of young age shall not stay with a young man in a solitary place, however near a relative he may be."},
  {"number": 172, "text": "Widows shall not pay ‘Holy’ and never indulge in wearing ornaments or dressing herself in thin delicate garments interwoven with silver or gold threads."},
  {"number": 173, "text": "The womenfolk shall not take bath without having clothes on and shall never conceal their period of menstruation."},
  {"number": 174, "text": "During the menstrual period, they shall not touch human being, clothes or vessels etc. for three days. They are free to do that only on the fourth day after taking the purifying bath."},
  {"number": "175–176", "text": "The Brahmacharins who get initiation to take life-long celibacy are called here Varnies. The dedicated Varnies who are my disciples shall not look at or speak to ladies deliberately. They shall not discuss about ladies and shall not perform the daily rites such as bathing, Sandhya Vandanas etc. in places normally visited by women."},
  {"number": 177, "text": "They shall not wilfully touch or look at the portraits or images of women though it is made of wood or metal, except the images of Goddesses."},
  {"number": 178, "text": "They shall never make images or draw pictures of ladies, never touch the clothes of women and shall not look at the animals at sexual mood wilfully."},
  {"number": 179, "text": "They shall neither look at nor touch even a male who is disguised as female. And shall not sing songs even on the greatness of God before ladies."},
  {"number": 180, "text": "They shall not obey any command forsaking their vow of celibacy even if it is given by their Guru. They shall live always a self-contented life with a steady mind and humility."},
  {"number": 181, "text": "If any woman tries to advance nearer to them, they shall instantly stop, by taunting her."},
  {"number": 182, "text": "But when they find that their own life or the life of a woman is in danger at any time, they shall save her life or their own life by speaking to her or even by touching her."},
  {"number": 183, "text": "They shall not massage their body with oil and shall not keep arms and shall not put on unseemly clothes. And they shall always keep their sense of taste under control."},
  {"number": 184, "text": "They shall have to go out for keeping their religious mendicity (for their food) to the households of Brahmins (only) but they shall not go to such houses where females have to serve the food. Instead they shall go to those Brahmin’s house where males can serve."},
  {"number": 185, "text": "They shall learn Vedas and Shastras and render service to Guru. They shall always avoid contact of those lustful males who often seek contacts of female (womaniser)"},
  {"number": 186, "text": "No one, a Brahmin by birth, shall drink water taken from a leather bag. And he shall never take things like onions and garlic."},
  {"number": 187, "text": "Taking bath, performing Sandhya Vandan, repeating Gayatri-Mantra, performing Vishnu-Pooja and Vaishvadeva Yagna are some of the daily religious duties of Brahmins in general. Among these rituals, the Naishtika Brahmacharins shall perform every rite and ritual proper to their Ashrama mode of life. Without doing such religious duties, they shall not take food."},
  {"number": 188, "text": "Special rules of conduct for Sadhus. The Sadhus shall avoid association with woman, womanisers, in the same way as the Naishtika Brahmacharins, and observe life-long celibacy. They shall also eliminate their inner enemies."},
  {"number": 189, "text": "They shall keep all their sensory-organs under their control especially the organ of taste. They shall neither earn or accumulate money nor allow others to do that on behalf."},
  {"number": 190, "text": "They shall not take safe custody of others’ wealth or accept any thing as trust. They shall never lose their forbearance. And shall never permit any woman to enter their residence."},
  {"number": 191, "text": "They shall never move out at nights without the company of their group even in the day time, they shall not move out alone, except under difficult circumstances."},

/* How many upcoming event days "Upcoming Event" shows. One day, as on the previous screen. */
const MAX_UPCOMING_DAYS = 4;              // the next day is shown in full, later days in brief if they fit
const SHLOK_ROTATION_MS = 2 * 60 * 1000;   // a new shlok every 2 minutes
const SHLOK_PAGE_CHARS = 260;               // longer shloks are shown in parts, each part large enough to read
const SHLOK_PAGE_MAX_MS = 30 * 1000;        // longest time one part stays on screen

const $ = id => document.getElementById(id);

/* ───────── Dates (Auckland time) ───────── */
function parseDate(s) {
  const [d, m, y] = s.split('/').map(Number);
  return new Date(y, m - 1, d, 0, 0, 0, 0);
}
function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function dateFromKey(key) {
  const [year, month, day] = key.split('-').map(Number);
  return new Date(year, month - 1, day, 0, 0, 0, 0);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function daysUntil(target, now) {
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const b = new Date(target.getFullYear(), target.getMonth(), target.getDate());
  return Math.round((b - a) / 86400000);
}
function dashboardPreviewDate() {
  const queryDate = new URLSearchParams(window.location.search).get('previewDate');
  const requestedDate = queryDate || document.body.dataset.previewDate || '';
  return /^\d{4}-\d{2}-\d{2}$/.test(requestedDate) ? requestedDate : '';
}
function aucklandNow() {
  const previewDate = dashboardPreviewDate();
  if (previewDate) {
    const [year, month, day] = previewDate.split('-').map(Number);
    return new Date(Date.UTC(year, month - 1, day, 0, 0, 0));
  }
  // The browser / signage player should be set to Auckland time.
  return new Date();
}
function aucklandDateKey(now) {
  const previewDate = dashboardPreviewDate();
  if (previewDate) return previewDate;
  const parts = new Intl.DateTimeFormat('en-CA', {
    year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Pacific/Auckland'
  }).formatToParts(now).reduce((result, part) => {
    if (part.type !== 'literal') result[part.type] = part.value;
    return result;
  }, {});
  return parts.year + '-' + parts.month + '-' + parts.day;
}
const fmtWeekday = new Intl.DateTimeFormat('en-NZ', {weekday: 'long', timeZone: 'Pacific/Auckland'});
const fmtFull = new Intl.DateTimeFormat('en-NZ', {day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Pacific/Auckland'});
const fmtDayMonth = new Intl.DateTimeFormat('en-NZ', {weekday: 'long', day: 'numeric', month: 'long'});
const fmtShortDay = new Intl.DateTimeFormat('en-NZ', {weekday: 'short', day: 'numeric', month: 'short'});

/* ───────── Event data: de-duplicated, sorted, grouped by day ───────── */
const SORTED_EVENTS = (() => {
  const seen = {};
  return EVENTS.map(e => ({...e, dt: parseDate(e.date)}))
    .filter(e => {
      const k = [dateKey(e.dt), e.event.trim().toLowerCase(), e.time || ''].join('|');
      if (seen[k]) return false;
      seen[k] = true;
      return true;
    })
    .sort((a, b) => a.dt - b.dt || Number(Boolean(b.time)) - Number(Boolean(a.time)));
})();
const EVENTS_BY_DAY = {};
SORTED_EVENTS.forEach(e => { (EVENTS_BY_DAY[dateKey(e.dt)] = EVENTS_BY_DAY[dateKey(e.dt)] || []).push(e); });
const EVENT_DAY_KEYS = Object.keys(EVENTS_BY_DAY).sort();

/* ───────── Daily colour ───────── */
/* Each day gets one of these jewel fields. Consecutive days are three steps apart, so
   tomorrow never looks like today. h = field hue, s = field saturation, a = accent hue
   (times), b = secondary hue (labels). Festival days can name their own palette with
   theme:"…" on the event; see SPECIAL_PALETTES. */
const DAILY_PALETTES = [
  {name: 'Ruby',     h: 348, s: 56, a: 40, b: 348},
  {name: 'Saffron',  h: 22,  s: 62, a: 44, b: 22},
  {name: 'Tulsi',    h: 128, s: 36, a: 48, b: 128},
  {name: 'Peacock',  h: 188, s: 62, a: 42, b: 188},
  {name: 'Sapphire', h: 220, s: 58, a: 40, b: 220},
  {name: 'Indigo',   h: 250, s: 48, a: 46, b: 250},
  {name: 'Amethyst', h: 282, s: 42, a: 44, b: 282},
  {name: 'Lotus',    h: 322, s: 46, a: 46, b: 322}
];
const SPECIAL_PALETTES = {
  chhathi:    {name: 'Bal Krishna Chhathi', h: 232, s: 60, a: 44, b: 330},
  navratri:   {name: 'Navratri',            h: 334, s: 62, a: 44, b: 300},
  dashera:    {name: 'Dashera',             h: 14,  s: 66, a: 42, b: 30},
  sharad:     {name: 'Sharad Poonam',       h: 222, s: 42, a: 200, b: 205},
  diwali:     {name: 'Diwali',              h: 6,   s: 74, a: 46, b: 42},
  annkut:     {name: 'Annkutotsav',         h: 38,  s: 66, a: 48, b: 14},
  nutan:      {name: 'Nutan Varsh',         h: 352, s: 58, a: 44, b: 38},
  prabodhini: {name: 'Prabodhini Ekadashi', h: 140, s: 40, a: 48, b: 100}
};

/* Big festivals: each gets its own colour theme on the day (and its greeting, if any, as the
   Today title), and a countdown in the Upcoming panel for the COUNTDOWN_DAYS before it.
   "event" must match the event name. */
const FESTIVALS = [
  {event: 'Navratri Begins',     label: 'Navratri',            theme: 'navratri', greeting: 'Happy Navratri'},
  {event: 'Dashera',             label: 'Dashera',             theme: 'dashera', greeting: 'Happy Dashera'},
  {event: 'Sharad Poonam',       label: 'Sharad Poonam',       theme: 'sharad'},
  {event: 'Diwali',              label: 'Diwali',              theme: 'diwali', greeting: 'Happy Diwali'},
  {event: 'Annkutotsav',         label: 'Annkutotsav',         theme: 'annkut'},
  {event: 'Nutan Varsharambh',   label: 'Nutan Varsh',         theme: 'nutan', greeting: 'Nutan Varshabhinandan'},
  {event: 'Prabodhini Ekadashi', label: 'Prabodhini Ekadashi', theme: 'prabodhini'}
];
const COUNTDOWN_DAYS = 21;
function festivalFor(e) {
  const name = e.event.trim().toLowerCase();
  return FESTIVALS.find(f => f.event.toLowerCase() === name) || null;
}

// Within each day: big festivals first, then other festivals, then scheduled programmes
// (events with a source such as the Mandal Santos Schedule). Otherwise the listed order is kept.
function eventRank(e) { return festivalFor(e) ? 0 : e.source ? 2 : 1; }
Object.keys(EVENTS_BY_DAY).forEach(key => EVENTS_BY_DAY[key].sort((a, b) => eventRank(a) - eventRank(b)));
function eventTheme(e) {
  const f = festivalFor(e);
  return e.theme || (f && f.theme) || '';
}
// The next big festival after today and within the countdown window, or null.
function nextFestival(todayKey) {
  const todayDate = dateFromKey(todayKey);
  for (const key of EVENT_DAY_KEYS) {
    if (key <= todayKey) continue;
    const days = daysUntil(dateFromKey(key), todayDate);
    if (days > COUNTDOWN_DAYS) return null;
    const e = EVENTS_BY_DAY[key].find(festivalFor);
    if (e) return {key, days, label: festivalFor(e).label};
  }
  return null;
}

function hslToRgb(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
}

const paletteCache = {};
function paletteFor(key) {
  if (paletteCache[key]) return paletteCache[key];
  const dayEvents = EVENTS_BY_DAY[key] || [];
  const themed = dayEvents.find(e => SPECIAL_PALETTES[eventTheme(e)]);
  let spec, special = false;
  if (themed) {
    spec = SPECIAL_PALETTES[eventTheme(themed)]; special = true;
  } else {
    const parts = key.split('-').map(Number);
    const ordinal = Math.floor(Date.UTC(parts[0], parts[1] - 1, parts[2]) / 86400000);
    spec = DAILY_PALETTES[(((ordinal * 3) % DAILY_PALETTES.length) + DAILY_PALETTES.length) % DAILY_PALETTES.length];
  }
  const hsl = (c, a) => a == null ? 'hsl(' + c[0] + ',' + c[1] + '%,' + c[2] + '%)' : 'hsla(' + c[0] + ',' + c[1] + '%,' + c[2] + '%,' + a + ')';
  const S = spec.s;
  const c = {
    deep: [spec.h, S, 7], field: [spec.h, S, 13], glow: [spec.h, S, 19],
    archTop: [spec.h, S - 4, 24], archBot: [spec.h, S, 16],
    accent: [spec.a, 90, 74], accentHi: [spec.a, 95, 86], accent2: [spec.b, 78, 86],
    ink: [spec.h, 60, 97], soft: [spec.h, 32, 84]
  };
  const vars = {
    '--deep': hsl(c.deep), '--field': hsl(c.field), '--glow': hsl(c.glow),
    '--arch-top': hsl(c.archTop), '--arch-bot': hsl(c.archBot),
    '--accent': hsl(c.accent), '--accent-hi': hsl(c.accentHi), '--accent-2': hsl(c.accent2),
    '--ink': hsl(c.ink), '--soft': hsl(c.soft),
    '--glow2': hsl([(spec.h + 38) % 360, S, 27], .7),
    '--line': hsl(c.accent, .4), '--hair': hsl(c.ink, .16),
    /* names used by the preview studio */
    '--bg': hsl(c.deep), '--panel': hsl(c.archBot), '--panel2': hsl(c.field),
    '--gold': hsl(c.accent), '--gold2': hsl(c.accentHi), '--pink': hsl(c.accent2), '--pink2': hsl(c.accent2),
    '--cream': hsl(c.ink), '--muted': hsl(c.soft),
    '--daily-wash-a': hsl(c.accent, .16), '--daily-wash-b': hsl(c.accent2, .12)
  };
  const rgb = v => hslToRgb(v[0], v[1], v[2]);
  return paletteCache[key] = {
    name: spec.name, special, vars,
    colours: {
      primary: rgb(c.accent), secondary: rgb(c.accent2), bg: rgb(c.deep), panel: rgb(c.archBot),
      panel2: rgb(c.field), heading: rgb(c.archTop), headingEnd: rgb(c.archBot),
      tint: hslToRgb(spec.h, Math.min(S + 14, 82), 52)
    }

}

let appliedTheme = '';
function applyTheme(key) {
  if (appliedTheme === key) return;
  const palette = paletteFor(key);
  Object.keys(palette.vars).forEach(p => document.body.style.setProperty(p, palette.vars[p]));
  document.body.dataset.themeDate = key;
  document.body.dataset.themeName = palette.name;
  appliedTheme = key;
}

/* ───────── Clock ───────── */
const CLOCK_FORMAT = new Intl.DateTimeFormat('en-NZ', {
  hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true, timeZone: 'Pacific/Auckland'
});
let shownTime = '';
function updateClock(date) {
  const parts = {};
  CLOCK_FORMAT.formatToParts(date).forEach(part => { parts[part.type] = part.value; });
  const hm = parts.hour + ':' + parts.minute;
  if (hm !== shownTime) {
    shownTime = hm;
    // Every digit gets a fixed-width slot, so the clock never jiggles as the numbers change.
    const hour = parts.hour.length < 2 ? '<span class="d ph">0</span><span class="d">' + parts.hour + '</span>'
      : '<span class="d">' + parts.hour.charAt(0) + '</span><span class="d">' + parts.hour.charAt(1) + '</span>';
    $('clockHM').innerHTML = hour + '<span class="c">:</span>' +
      '<span class="d">' + parts.minute.charAt(0) + '</span><span class="d">' + parts.minute.charAt(1) + '</span>';
    $('clockPeriod').textContent = (parts.dayPeriod || '').replace(/\./g, '').toUpperCase();
  }
  const sec = (parts.second || '00').padStart(2, '0');
  $('clockSec').innerHTML = '<span class="d">' + sec.charAt(0) + '</span><span class="d">' + sec.charAt(1) + '</span>';
  // The colon dims every other second, so a frozen screen is easy to spot.
  $('clock').classList.toggle('off', Number(parts.second) % 2 === 1);
}

/* ───────── Today and Coming up ───────── */
const state = {todayEvents: [], upcoming: [], signature: ''};

function noteLines(e) {
  return e.note ? e.note.split(/\s*•\s*/).filter(Boolean) : [];
}

// Largest sizes (px) for name / time / note, by how many events are on today. layoutToday() shrinks
// them in small steps until the whole day fits inside the niche.
const TODAY_SIZES = {1: [140, 62, 40], 2: [112, 52, 34], 3: [92, 44, 30], 4: [80, 38, 28], 5: [68, 34, 26]};

function todayMarkup(events) {
  if (!events.length) {
    return '<div class="ev-list"><div class="ev">' +
      '<div class="ev-name">Enjoy a blessed day of satsang and seva.</div></div></div>';
  }
  return '<div class="ev-list">' + events.map(e =>
    '<article class="ev">' +
      (e.source ? '<div class="ev-source">' + escapeHtml(e.source) + '</div>' : '') +
      '<div class="ev-name">' + escapeHtml(e.event) + '</div>' +
      (e.intro ? '<p class="ev-intro">' + escapeHtml(e.intro) + '</p>' : '') +
      (e.time ? '<div class="ev-time">' + escapeHtml(e.time) + '</div>' : '') +
      noteLines(e).map(n => '<div class="ev-note">' + escapeHtml(n) + '</div>').join('') +
    '</article>'
  ).join('') + quoteMarkup(events) + '</div>';
}

// One festival message per day: the big festival's own if it has one, else the first listed.
function quoteMarkup(events) {
  const e = events.find(x => x.quote && festivalFor(x)) || events.find(x => x.quote);
  return e ? '<p class="ev-quote">' + escapeHtml(e.quote) + '</p>' : '';
}

// Bold date first, then the events of that day.
function comingDayMarkup(group, todayDate, full) {
  const d = daysUntil(group.dt, todayDate);
  const rel = d === 1 ? 'Tomorrow' : 'In ' + d + ' days';
  return '<section class="cday' + (full ? '' : ' brief') + '">' +
    '<span class="cday-date">' + escapeHtml((full ? fmtDayMonth : fmtShortDay).format(group.dt)) + '</span>' +
    '<span class="cday-rel">' + rel + '</span>' +
    group.events.map(e =>
      '<div class="cev">' +
        (full && e.source ? '<div class="cev-source">' + escapeHtml(e.source) + '</div>' : '') +
        '<div class="cev-name">' + escapeHtml(e.event) + '</div>' +
        (e.time ? '<div class="cev-time">' + escapeHtml(e.time) + '</div>' : '') +
        (full ? noteLines(e).map(n => '<div class="cev-note">' + escapeHtml(n) + '</div>').join('') : '') +
      '</div>'
    ).join('') + '</section>';
}

function inCanvas() { return document.body.classList.contains('tv-canvas'); }
function portraitScale() { return Math.max(.34, Math.min(.8, window.innerWidth / 900)); }

function layoutToday() {
  const box = $('todayEvents');
  const count = Math.min(state.todayEvents.length, 5);
  const sizes = count === 0 ? [88, 50, 30] : (TODAY_SIZES[count] || [60, 30, 24]);
  const scale = inCanvas() ? 1 : portraitScale();
  box.style.setProperty('--s-name', sizes[0]);
  box.style.setProperty('--s-time', sizes[1]);
  box.style.setProperty('--s-note', sizes[2]);
  if (!inCanvas()) { box.style.setProperty('--u', scale.toFixed(2)); return; }
  const list = box.firstElementChild;
  let u = 1;
  box.style.setProperty('--u', '1');
  while (list && list.offsetHeight > box.clientHeight && u > .32) {
    u = Math.round((u - .03) * 100) / 100;
    box.style.setProperty('--u', String(u));
  }
}

// Height actually used by a box's content. (scrollHeight can't be used for a fit test:
// it never reports less than the box's own height.)
function contentBottom(box) {
  const last = box.lastElementChild;
  return last ? last.offsetTop + last.offsetHeight - box.offsetTop : 0;
}

function countdownMarkup(f) {
  return '<span class="fest-label">Countdown to</span>' +
    '<span class="fest-name">' + escapeHtml(f.label) + '</span>' +
    '<span class="fest-days"><b>' + f.days + '</b> ' + (f.days === 1 ? 'day' : 'days') + ' to go</span>';
}

// Fills the Upcoming panel and returns how many days it shows.
function fitComing(wrap, groups, todayDate) {
  if (!groups.length) {
    wrap.innerHTML = '<div class="coming-empty">No further events are listed yet.</div>';
    return 0;
  }
  if (!inCanvas()) {
    wrap.style.setProperty('--u2', portraitScale().toFixed(2));
    wrap.innerHTML = groups.map((g, i) => comingDayMarkup(g, todayDate, i === 0)).join('');
    return groups.length;
  }
  for (let days = Math.min(MAX_UPCOMING_DAYS, groups.length); days >= 1; days--) {
    wrap.innerHTML = groups.slice(0, days).map((g, i) => comingDayMarkup(g, todayDate, i === 0)).join('');
    const floor = days === 1 ? .4 : .8;   // tomorrow keeps its size; extra days are added only if they fit
    // With one day shown there is room to spare, so start a little larger and shrink only if needed.
    for (let u = days === 1 ? 1.2 : 1; u >= floor - .001; u = Math.round((u - .04) * 100) / 100) {
      wrap.style.setProperty('--u2', String(u));
      if (contentBottom(wrap) <= wrap.clientHeight - 16) return days;
    }
  }
  return 1; // best effort: smallest size, anything beyond is clipped
}

function layoutComing() {
  const wrap = $('nextEvent'), fest = $('festCountdown');
  const todayDate = dateFromKey(state.today);
  const groups = state.upcoming;
  const f = state.festival;
  fest.hidden = !f;
  if (f) fest.innerHTML = countdownMarkup(f);
  let shown = fitComing(wrap, groups, todayDate);
  // No countdown when the festival is already listed in the panel.
  if (f && groups.slice(0, shown).some(g => g.key === f.key)) {
    fest.hidden = true;
    shown = fitComing(wrap, groups, todayDate);
  }
  $('comingTitle').textContent = shown > 1 ? 'Upcoming Events' : 'Upcoming Event';
}

function layoutPanels() {
  layoutToday();
  layoutComing();
  layoutShlokText();
}
let layoutFrame = 0;
function scheduleLayout() {
  if (layoutFrame) window.cancelAnimationFrame(layoutFrame);
  layoutFrame = window.requestAnimationFrame(() => { layoutFrame = 0; layoutPanels(); });
}

/* ───────── Rotating shlok (same order and timing as before) ───────── */
function seededRandom(seed) {
  let s = seed >>> 0;
  return function() {
    s = (s + 0x6D2B79F5) >>> 0;
    let v = s;
    v = Math.imul(v ^ (v >>> 15), v | 1);
    v ^= v + Math.imul(v ^ (v >>> 7), v | 61);
    return ((v ^ (v >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffledOrder(cycle) {
  if (cycle === cachedCycle) return cachedOrder;
  const order = Array.from({length: DAILY_SHLOKS.length}, (_, i) => i);
  const random = seededRandom((cycle ^ 0x9E3779B9) >>> 0);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  cachedCycle = cycle; cachedOrder = order;
  return order;
}
function currentShlok(now) {
  const slot = Math.floor(now.getTime() / SHLOK_ROTATION_MS);
  const cycle = Math.floor(slot / DAILY_SHLOKS.length);
  const position = ((slot % DAILY_SHLOKS.length) + DAILY_SHLOKS.length) % DAILY_SHLOKS.length;
  return {slot, shlok: DAILY_SHLOKS[shuffledOrder(cycle)[position]]};
}

// Long shloks are split at sentence ends into parts of roughly equal length.
const pageCache = {};
function shlokPages(text) {
  if (pageCache[text]) return pageCache[text];

  const target = Math.ceil(text.length / count);
  const sentences = text.match(/[^.;?!]+[.;?!]+["”’)]*\s*|[^.;?!]+$/g) || [text];
  const tokens = [];
  sentences.forEach(s => {
    s = s.trim();
    if (!s) return;
    if (s.length <= target * 1.3) { tokens.push(s); return; }
    let cur = '';
    s.split(/\s+/).forEach(w => {
      if (cur && cur.length + 1 + w.length > target) { tokens.push(cur); cur = w; }
      else cur = cur ? cur + ' ' + w : w;
    });
    if (cur) tokens.push(cur);
  });
  const pages = [];
  let cur = '';
  tokens.forEach(t => {
    if (cur && cur.length + 1 + t.length > target && cur.length >= target * .6) { pages.push(cur); cur = t; }
    else cur = cur ? cur + ' ' + t : t;
  });
  if (cur) pages.push(cur);
  // Don't leave a stranded fragment on the last part.
  while (pages.length > 1 && pages[pages.length - 1].length < target * .5 &&
         pages[pages.length - 2].length + 1 + pages[pages.length - 1].length <= SHLOK_PAGE_CHARS * 1.25) {
    const tail = pages.pop();
    pages[pages.length - 1] += ' ' + tail;
  }
  return pageCache[text] = pages;
}

let activeShlokKey = '';
let shlokToken = 0;
let shownShlok = null;   // {number, pages, page}

const ENDS_SENTENCE = /[.;?!]["”’)]*$/;
function shlokDisplayText(pages, page) {
  const last = page === pages.length - 1;
  const lead = page === 0 ? '“' : (ENDS_SENTENCE.test(pages[page - 1]) ? '' : '…');
  const tail = last ? '”' : (ENDS_SENTENCE.test(pages[page]) ? '' : '…');
  return lead + pages[page] + tail;
}
function shlokSourceText(shlok, pages, page) {
  return 'Shikshapatri, Shlok' + (String(shlok.number).indexOf('–') > -1 ? 's ' : ' ') + shlok.number + (pages.length > 1 ? ', part ' + (page + 1) + ' of ' + pages.length : '');
}

function layoutShlokText() {
  const text = $('todayShlokText'), box = $('shlokBox');
  if (!text.textContent) return;
  if (!inCanvas()) {
    const len = text.textContent.length;
    const base = Math.max(17, Math.min(28, window.innerWidth / 15));
    text.style.fontSize = Math.round(len > 220 ? base * .82 : len > 140 ? base * .92 : base) + 'px';
    return;
  }
  for (let size = 40; size >= 24; size -= 2) {
    text.style.fontSize = size + 'px';
    if (text.offsetHeight <= box.clientHeight) break;
  }
}

function updateShlok(now) {
  const current = currentShlok(now);
  const pages = shlokPages(current.shlok.text);
  const slotMs = ((now.getTime() % SHLOK_ROTATION_MS) + SHLOK_ROTATION_MS) % SHLOK_ROTATION_MS;
  const pageMs = Math.min(SHLOK_PAGE_MAX_MS, SHLOK_ROTATION_MS / pages.length);
  const page = Math.floor(slotMs / pageMs) % pages.length;
  const key = current.slot + ':' + page;
  if (key === activeShlokKey) return;

  const first = activeShlokKey === '';
  activeShlokKey = key;
  const token = ++shlokToken;
  const wrap = $('todayShlok');
  const reveal = () => {
    if (token !== shlokToken) return;
    $('todayShlokText').textContent = shlokDisplayText(pages, page);
    $('todayShlokSource').textContent = shlokSourceText(current.shlok, pages, page);
    layoutShlokText();
    wrap.classList.remove('is-leaving');
    if (!first) {
      wrap.classList.add('is-entering');
      wrap.addEventListener('animationend', () => wrap.classList.remove('is-entering'), {once: true});
    }
  };
  if (first) { reveal(); return; }
  wrap.classList.remove('is-entering');
  wrap.classList.add('is-leaving');
  window.setTimeout(reveal, 480);
}

/* ───────── Render (called every second, and by the preview studio) ───────── */
function render() {
  const now = aucklandNow();
  const today = aucklandDateKey(now);
  const todayDate = dateFromKey(today);
  applyTheme(today);

  updateClock(new Date());   // real time, even while previewing another date
  $('dayName').textContent = fmtWeekday.format(now);
  $('fullDate').textContent = fmtFull.format(now);

  const todayEvents = EVENTS_BY_DAY[today] || [];
  const greeting = todayEvents.map(festivalFor).find(f => f && f.greeting);
  $('todayTitle').textContent = greeting ? greeting.greeting + '!' :
    todayEvents.length ? 'Today at the Mandir' : 'No events listed today';
  const upcoming = EVENT_DAY_KEYS.filter(k => k > today).slice(0, MAX_UPCOMING_DAYS).map(k => ({
    key: k, dt: dateFromKey(k), events: EVENTS_BY_DAY[k]
  }));
  const festival = nextFestival(today);
  const sig = [today, inCanvas() ? 'tv' : 'phone', festival ? festival.key : '']
    .concat(todayEvents.map(e => [e.event, e.time, e.note, e.source, e.intro].join('~')))
    .concat(upcoming.map(g => g.key + ':' + g.events.map(e => [e.event, e.time, e.note, e.source].join('~')).join('|')))
    .join('||');
  if (sig !== state.signature) {
    state.signature = sig;
    state.today = today;
    state.todayEvents = todayEvents;
    state.upcoming = upcoming;
    state.festival = festival;
    $('todayEvents').innerHTML = todayMarkup(todayEvents);
    layoutPanels();
  }
  updateShlok(now);
}

/* ───────── Fit the 1920×1080 canvas to whatever screen it is on ───────── */
const DASHBOARD_DESIGN_WIDTH = 1920;
const DASHBOARD_DESIGN_HEIGHT = 1080;

function fitDashboardToViewport() {
  const screen = document.querySelector('.screen');
  if (!screen) return;
  const wasCanvas = inCanvas();
  const useTvCanvas = window.innerWidth > window.innerHeight || window.innerWidth > 1200;
  document.body.classList.toggle('tv-canvas', useTvCanvas);
  if (useTvCanvas) {
    const scale = Math.min(window.innerWidth / DASHBOARD_DESIGN_WIDTH, window.innerHeight / DASHBOARD_DESIGN_HEIGHT);
    screen.style.transform = 'scale(' + Math.max(scale, 0.1) + ')';
  } else {
    screen.style.removeProperty('transform');
  }
  if (wasCanvas !== useTvCanvas) state.signature = '';
  scheduleLayout();
}

window.addEventListener('resize', () => { fitDashboardToViewport(); render(); }, {passive: true});
window.addEventListener('orientationchange', () => { fitDashboardToViewport(); render(); }, {passive: true});
fitDashboardToViewport();
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleLayout);
setInterval(render, 1000);

    '<button type="button" class="pv-bar-date" data-action="open" aria-label="Choose another day"><strong id="pvBarDate"></strong><span id="pvBarRel"></span></button>' +
    '<button type="button" class="pv-bar-step" data-action="step-forward" aria-label="Next day">' + ICONS.right + '</button>' +
    '<button type="button" class="pv-bar-live" data-action="live"><i class="pv-live-dot"></i>Live</button>';
  document.body.appendChild(bar);

  const barDate = bar.querySelector('#pvBarDate');
  const barRelative = bar.querySelector('#pvBarRel');
  const baseTitle = document.title;
  let wakeTimer = 0;

  function wakeBar() {
    if (bar.hidden) return;
    bar.classList.add('is-awake');
    window.clearTimeout(wakeTimer);
    wakeTimer = window.setTimeout(() => bar.classList.remove('is-awake'), 2600);
  }

  function syncBar() {
    const key = dashboardPreviewDate();
    bar.hidden = !key;
    document.body.classList.toggle('pv-active', Boolean(key));
    document.title = key ? 'Preview · ' + fmtShortDay.format(dateFromKey(key)) + ' — ' + baseTitle : baseTitle;
    if (!key) return;
    barDate.textContent = fmtCompact.format(dateFromKey(key));
    barRelative.textContent = relativeLabel(key);
    wakeBar();
  }

  function stepPreview(days) {
    setPreview(shiftKey(dashboardPreviewDate() || liveTodayKey(), days));
  }

  bar.addEventListener('click', event => {
    const control = event.target.closest('[data-action]');
    if (!control) return;
    const action = control.dataset.action;
    if (action === 'step-back') stepPreview(-1);
    else if (action === 'step-forward') stepPreview(1);
    else if (action === 'open') open();
    else if (action === 'live') setPreview('');
  });

  document.addEventListener('mousemove', wakeBar, {passive:true});
  document.addEventListener('touchstart', wakeBar, {passive:true});
  document.addEventListener('keydown', event => {
    if (!overlay.hidden || bar.hidden || event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.key === 'ArrowLeft') stepPreview(-1);
    else if (event.key === 'ArrowRight') stepPreview(1);
  });

  // ---- Applying a preview ----
  function refreshDashboard() {
    render();
    syncBar();
    if (!screen) return;
    screen.classList.remove('pv-swap');
    void screen.offsetWidth;
    screen.classList.add('pv-swap');
  }

  function setPreview(key) {
    const url = new URL(window.location.href);
    if (key) url.searchParams.set('previewDate', key);
    else url.searchParams.delete('previewDate');
    if (url.href === window.location.href) return;
    try {
      window.history.pushState(null, '', url.href);
    } catch (err) {
      window.location.href = url.href;
      return;
    }
    refreshDashboard();
  }

  if (screen) {
    screen.addEventListener('animationend', event => {
      if (event.animationName === 'pvSwap') screen.classList.remove('pv-swap');
    });
  }
  window.addEventListener('popstate', refreshDashboard);
  dateCard.addEventListener('click', open);
  syncBar();
})();

</script>
</body>
</html>
