<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SSMB Auckland — Event Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@700&family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#050505;
    --panel:#111111;
    --panel2:#171717;
    --gold:#f6c945;
    --gold2:#ffdf69;
    --pink:#d94a96;
    --pink2:#f27abd;
    --cream:#fff8df;
    --muted:#a9a9a9;
    --line:rgba(246,201,69,.20);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:white; }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    background:
      radial-gradient(circle at 50% -15%, rgba(246,201,69,.11), transparent 34%),
      radial-gradient(circle at 90% 90%, rgba(217,74,150,.08), transparent 30%),
      #050505;
  }
  body.theme-royal { --gold:#74a7ff; --gold2:#a9c8ff; --pink:#8f62ff; --pink2:#bb9cff; --line:rgba(116,167,255,.30); background:radial-gradient(circle at 18% 20%,rgba(65,105,225,.18),transparent 35%),radial-gradient(circle at 86% 82%,rgba(143,98,255,.15),transparent 32%),#050508; }
  body.theme-lotus { --gold:#ffbf69; --gold2:#ffd39b; --pink:#e84f9b; --pink2:#ff86bf; --line:rgba(232,79,155,.28); background:radial-gradient(circle at 20% 18%,rgba(232,79,155,.16),transparent 35%),radial-gradient(circle at 88% 85%,rgba(255,191,105,.13),transparent 31%),#080507; }
  body.theme-teal { --gold:#63e6be; --gold2:#96f2d7; --pink:#22b8cf; --pink2:#66d9e8; --line:rgba(99,230,190,.27); background:radial-gradient(circle at 20% 18%,rgba(34,184,207,.16),transparent 35%),radial-gradient(circle at 88% 85%,rgba(99,230,190,.12),transparent 31%),#040807; }
  body.theme-amber { --gold:#f6c945; --gold2:#ffdf69; --pink:#d94a96; --pink2:#f27abd; --line:rgba(246,201,69,.20); }
  .screen {
    width:1920px; height:1080px; max-width:100vw; max-height:100vh;
    margin:auto; padding:38px 58px 34px;
    display:grid; grid-template-rows:222px 1fr; gap:22px;
    position:relative;
  }
  .screen::before {
    content:""; position:absolute; left:58px; right:58px; top:260px;
    height:1px; background:linear-gradient(90deg,transparent,var(--gold),var(--pink),var(--gold),transparent);
    opacity:.65;
  }
  .header { display:grid; grid-template-columns:430px minmax(0,1fr) 430px; column-gap:28px; align-items:center; }
  .brand {
    width:100%; height:168px; object-fit:contain; object-position:left center;
    filter:drop-shadow(0 5px 18px rgba(0,0,0,.65));
  }
  .brand-raksha { display:none; }
  body.raksha-bandhan-day .header > .brand:not(.brand-raksha) { display:none; }
  body.raksha-bandhan-day .brand-raksha { display:block; }
  .time-card {
    position:relative; justify-self:center;
    width:100%; min-height:184px; padding:12px 20px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .time-card::before {
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 35%, color-mix(in srgb,var(--gold) 18%,transparent), transparent 68%),
      linear-gradient(135deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
    border:1px solid var(--line); border-radius:28px; z-index:-1;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 42px rgba(0,0,0,.30);
  }
  .time-card::after { content:""; position:absolute; left:10%; right:10%; bottom:0; height:3px; border-radius:4px; background:linear-gradient(90deg,transparent,var(--gold),var(--pink2),transparent); opacity:.9; }
  .clock {
    font-family:'Cinzel', Georgia, serif;
    font-size:150px; font-weight:700; line-height:.94;
    font-variant-numeric:tabular-nums;
    letter-spacing:3px; margin-right:-3px; white-space:nowrap;
    color:#ffffff;
    text-shadow:0 0 34px color-mix(in srgb,var(--gold) 32%,transparent),0 8px 22px rgba(0,0,0,.55);
  }
  .date-card {
    align-self:center; width:100%; min-height:184px; margin-top:0; padding:20px 24px 18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:1px solid var(--line); border-radius:22px;
    background:linear-gradient(135deg,color-mix(in srgb,var(--pink) 11%,transparent),rgba(255,255,255,.025));
    box-shadow:inset 4px 0 0 var(--pink2),0 16px 36px rgba(0,0,0,.28);
    text-align:center;
  }
  .day-name { display:block; color:var(--gold2); font-size:44px; font-weight:800; letter-spacing:2.6px; line-height:1.05; text-transform:uppercase; }
  .full-date { display:block; margin-top:10px; color:#f4f4f4; font-family:Georgia,serif; font-size:38px; line-height:1.16; letter-spacing:.4px; font-weight:700; }
  .main {
    display:grid; grid-template-columns:minmax(0,7fr) minmax(0,3fr); gap:28px; min-height:0;
  }
  .hero {
    border:1px solid var(--line); border-radius:28px; padding:36px 42px;
    background:
      radial-gradient(circle at 50% 0%, rgba(246,201,69,.15), transparent 52%),
      linear-gradient(145deg,#17130a,#0c0c0c 65%);
    display:flex; flex-direction:column; justify-content:center; position:relative; overflow:hidden;
  }
  .today-copy { position:relative; z-index:3; width:100%; max-width:980px; padding-right:22px; display:flex; flex-direction:column; justify-content:center; gap:20px; }
  .hero::after {
    content:""; position:absolute; width:430px; height:430px; border:1px solid rgba(217,74,150,.18);
    border-radius:50%; right:-180px; bottom:-230px;
  }
  .eyebrow { color:var(--gold); font-size:17px; letter-spacing:3px; text-transform:uppercase; font-weight:700; }
  .today-title {
    align-self:flex-start; font-family:'Cinzel',Georgia,serif; font-size:42px; font-weight:700; line-height:1.05;
    margin:0; padding:18px 28px; color:#fff;
    white-space:nowrap; letter-spacing:-1px; text-transform:uppercase;
    border:1px solid color-mix(in srgb,var(--gold) 56%,transparent); border-radius:18px;
    background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 18%,transparent),rgba(255,255,255,.025));
    box-shadow:inset 5px 0 0 var(--gold),0 12px 30px rgba(0,0,0,.28);
    text-shadow:0 4px 18px rgba(0,0,0,.42);
  }
  .today-events { 
    font-family:'Philosopher',Georgia,serif; font-size:72px; line-height:1.08; color:#fff; font-weight:700;
    text-shadow:0 0 24px color-mix(in srgb,var(--gold) 34%,transparent),0 8px 22px rgba(0,0,0,.65);
  }
  .today-events .event-line { padding:13px 0 17px; border-bottom:1px solid rgba(255,255,255,.10); }
  .today-events .event-line:last-child { border-bottom:0; }
  .santo-schedule-label {
    display:flex; align-items:center; justify-content:center; width:fit-content;
    margin:0 auto 10px; padding:6px 14px;
    border:1px solid color-mix(in srgb,var(--pink2) 60%,transparent); border-radius:999px;
    background:color-mix(in srgb,var(--pink) 13%,transparent); color:var(--pink2);
    font-family:'Philosopher',Georgia,serif; font-size:24px; line-height:1.1;
    font-weight:700; letter-spacing:2px; text-transform:uppercase; text-shadow:none;
  }
  .today-event-time { margin-top:8px; color:var(--gold2); font-size:28px; line-height:1.2; font-weight:700; }
  .today-event-note { margin-top:6px; color:#d3cbc0; font-size:22px; line-height:1.25; font-weight:700; }
  .today-events.quote-positioned {
    padding-bottom:16px;
    border-bottom:1px solid rgba(255,255,255,.14);
  }
  .today-events.quote-positioned .event-line:nth-last-child(2) { border-bottom:0; }
  .next-wrap {
    display:flex; flex:1; min-height:0; height:100%;
    flex-direction:column; justify-content:flex-start;
  }
  .next-label {
    width:fit-content; padding-bottom:13px;
    color:var(--pink2); font-size:48px; line-height:1.08; letter-spacing:3px;
    text-transform:uppercase; font-weight:700;
    border-bottom:4px solid var(--pink2);
  }
  .next-event {
    width:100%; margin-top:24px; flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; justify-content:center;
    font-family:'Philosopher',Georgia,serif; font-size:84px; line-height:1.06; font-weight:700; color:white;
  }
  .next-event.multiple-events {
    margin-top:14px; font-size:56px; line-height:1.04;
    justify-content:space-evenly;
  }
  .next-event.many-events { font-size:42px; line-height:1.06; }
  .next-event-item { padding:18px 0 22px; border-bottom:1px solid rgba(255,255,255,.14); }
  .next-event-item .santo-schedule-label { margin:0 0 10px; font-size:21px; }
  .next-event-time { display:block; margin-top:10px; color:var(--gold2); font-size:34px; line-height:1.2; font-weight:700; }
  .next-event-note { display:block; margin-top:8px; color:#bfb8ad; font-size:28px; line-height:1.25; font-weight:700; }
  .next-date {
    flex:0 0 auto; color:#eeeeee; font-size:38px; line-height:1.18;
    margin-top:18px; padding:0 0 18px; font-weight:700; letter-spacing:.2px;
    border-bottom:1px solid rgba(255,255,255,.14);
  }
  .next-event.multiple-events .next-event-item {
    flex:1 1 0; min-height:0; padding:18px 0 20px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .next-event.many-events .next-event-item { padding:12px 0 14px; }
  .next-event.multiple-events .santo-schedule-label { margin-bottom:6px; padding:4px 10px; font-size:18px; }
  .next-event.multiple-events .next-event-time { margin-top:6px; font-size:28px; }
  .next-event.multiple-events .next-event-note { margin-top:5px; font-size:23px; }
  .today-events .event-line { width:100%; }
  .scripture-quote {
    width:min(100%,980px); margin:20px auto 0; color:#dfd7c8;
    min-height:140px; padding:10px 18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Philosopher',Georgia,serif; font-size:34px; line-height:1.34; font-weight:400;
    text-align:center; text-shadow:0 4px 16px rgba(0,0,0,.48);
    background:transparent !important; box-shadow:none;
    opacity:1; transform:translateY(0);
    transition:opacity .48s ease,transform .58s cubic-bezier(.22,.8,.22,1);
  }
  .scripture-quote.medium { font-size:31px; }
  .scripture-quote.long { font-size:22px; }
  .scripture-quote.xlong { font-size:18px; line-height:1.28; }
  .scripture-quote.is-leaving { opacity:0; transform:translateY(-14px); }
  .scripture-quote.is-entering { animation:shlokFlowIn .9s cubic-bezier(.18,.82,.2,1) both; }
  .scripture-quote em { font-style:italic; }
  .scripture-source {
    display:block; margin-top:9px; color:var(--gold2);
    font-family:'Philosopher',Georgia,serif; font-size:16px; line-height:1.3;
    font-style:normal; font-weight:700; letter-spacing:1.6px; text-transform:uppercase;
  }
  @keyframes shlokFlowIn {
    0% { opacity:0; transform:translateY(18px); }
    58% { opacity:.82; }
    100% { opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion:reduce) {
    .scripture-quote { transition:opacity .2s ease; }
    .scripture-quote.is-leaving { transform:none; }
    .scripture-quote.is-entering { animation:none; }
  }
  .countdown { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:22px; }
  .unit { background:#0b0b0b; border:1px solid rgba(246,201,69,.22); border-radius:12px; padding:12px 10px; min-width:0; text-align:center; }
  .num { display:block; font-size:32px; font-weight:800; font-variant-numeric:tabular-nums; }
  .lbl { display:block; margin-top:3px; font-size:11px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; }
  .upcoming {
    min-height:0; border:1px solid rgba(255,255,255,.09); border-radius:24px;
    background:rgba(15,15,15,.9); padding:26px 30px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .section-head { display:flex; justify-content:space-between; align-items:end; margin-bottom:20px; }
  .section-title { font-family:Georgia,serif; font-size:29px; color:var(--cream); }
  .section-sub { font-size:12px; color:#8e8e8e; letter-spacing:1px; text-transform:uppercase; }
  .event-list { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:18px 20px; flex:1; overflow:hidden; }
  .event {
    border:1px solid rgba(255,255,255,.08); border-radius:18px;
    background:linear-gradient(135deg,#171717,#101010); padding:22px 26px;
    display:grid; grid-template-columns:100px 1fr; gap:20px; align-items:center;
    position:relative;
  }
  .event.soon { border-color:rgba(246,201,69,.42); box-shadow:inset 3px 0 0 var(--gold); }
  .event.progress { border-color:rgba(217,74,150,.38); }
  .event-date { text-align:center; border-right:1px solid rgba(255,255,255,.08); padding-right:16px; }
  .day { display:block; font-size:36px; font-weight:800; line-height:1; color:var(--gold2); }
  .month { display:block; font-size:13px; letter-spacing:2px; color:#aaa; text-transform:uppercase; margin-top:7px; }
  .dow { display:block; font-size:12px; color:#777; margin-top:4px; }
  .event-name { font-size:30px; line-height:1.25; font-weight:700; color:#f3f3f3; }
  .days { font-size:13px; margin-top:10px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
  .days strong { color:var(--gold); }
  .mini-bar { height:5px; background:#292929; border-radius:8px; margin-top:13px; overflow:hidden; }
  .mini-fill { height:100%; width:0%; background:linear-gradient(90deg,var(--pink),var(--gold)); transition:width .5s; }

  .quote { margin-top:8px; color:#bdbdbd; font-family:Georgia,serif; font-size:14px; line-height:1.35; font-style:italic; }
  .hero-quote { margin-top:16px; padding:14px 18px; border-left:3px solid var(--gold); background:rgba(246,201,69,.055); color:#d8d8d8; font-family:Georgia,serif; font-size:18px; line-height:1.42; font-style:italic; border-radius:0 10px 10px 0; }
  .thoughts { margin-top:42px; display:grid; gap:12px; }
  .thought { padding:22px 22px; border:1px solid rgba(255,255,255,.08); border-radius:16px; background:rgba(255,255,255,.025); color:#e0e0e0; font-family:Georgia,serif; font-size:24px; line-height:1.42; font-style:italic; }
  .thought.today-thought { border-left:3px solid var(--gold); }
  .thought.next-thought { border-left:3px solid var(--pink2); }
  .quote-label { color:var(--gold); font-family:"Segoe UI",Arial,sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; font-style:normal; margin-bottom:5px; }
  .empty {
    height:100%; display:flex; align-items:center; justify-content:center;
    color:#999; font-size:24px;
  }
  .special { color:var(--pink2); }
  /* TV mode keeps the approved 1920×1080 composition and scales it as one canvas. */
  body.tv-canvas {
    display:flex; align-items:center; justify-content:center;
    width:100%; height:100%; min-height:0; overflow:hidden;
  }
  body.tv-canvas .screen {
    flex:0 0 auto; width:1920px; height:1080px; min-height:0;
    max-width:none; max-height:none; margin:0; transform-origin:center center;
  }

  @media (max-width:1200px) and (orientation:portrait) {
    html,body { width:100%; height:auto; min-height:100%; overflow:auto; }
    body { min-height:100dvh; }
    .screen {
      width:100%; height:auto; max-width:none; max-height:none; min-height:100dvh;
      padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
      display:flex; flex-direction:column; gap:16px;
    }
    .screen::before { display:none; }
    .header { display:grid; grid-template-columns:1fr; gap:14px; align-items:stretch; }
    .brand { grid-column:1 / -1; width:100%; height:auto; max-height:135px; object-position:center; }
    .time-card { min-height:122px; padding:14px 12px; }
    .time-card::before { border-radius:20px; }
    .clock { font-size:clamp(52px,13vw,84px); letter-spacing:1px; margin-right:-1px; }
    .date-card { align-self:stretch; margin:0; padding:15px 14px; border-radius:20px; text-align:center; display:flex; flex-direction:column; justify-content:center; }
    .day-name { font-size:clamp(26px,6.8vw,36px); letter-spacing:1.5px; }
    .full-date { margin-top:7px; font-size:clamp(24px,5.8vw,32px); }
    .main { display:flex; flex-direction:column; gap:16px; min-height:0; }
    .hero { min-height:430px; padding:26px 22px; border-radius:22px; justify-content:center; }
    .today-copy { max-width:none; padding:0; gap:17px; }
    .today-title { width:100%; padding:15px 16px; font-size:clamp(25px,7vw,36px); text-align:center; white-space:normal; border-radius:15px; }
    .today-events { font-size:clamp(48px,12vw,70px); text-align:center; }
    .upcoming { min-height:300px; padding:28px 22px; border-radius:22px; }
    .next-wrap { justify-content:center; text-align:center; }
    .next-label { align-self:center; padding-bottom:8px; font-size:clamp(23px,6vw,30px); border-bottom-width:3px; }
    .next-event { margin-top:16px; font-size:clamp(50px,12.5vw,72px); }
    .next-event.multiple-events { font-size:clamp(38px,9vw,54px); }
    .next-event.many-events { font-size:clamp(30px,7.4vw,42px); }
    .next-event-item { padding:13px 0 15px; }
    .santo-schedule-label { margin-bottom:8px; padding:5px 11px; font-size:clamp(15px,4vw,20px); letter-spacing:1.3px; }
    .next-event-item .santo-schedule-label { margin:0 auto 8px; font-size:clamp(14px,3.7vw,18px); }
    .next-event-time { margin-top:6px; font-size:clamp(18px,4.7vw,24px); }
    .next-event-note { margin-top:5px; font-size:clamp(16px,4.1vw,21px); }
    .next-date { font-size:clamp(24px,6vw,32px); line-height:1.2; padding-bottom:14px; }
    .scripture-quote { margin-top:16px; font-size:clamp(22px,5.8vw,30px); line-height:1.38; }
    .today-events.quote-positioned { padding-bottom:14px; }
    .today-events.quote-positioned .scripture-quote { min-height:170px; }
    .scripture-quote.medium { font-size:clamp(20px,5.3vw,27px); }
    .scripture-quote.long { font-size:clamp(18px,4.6vw,22px); }
    .scripture-quote.xlong { font-size:clamp(14px,3.7vw,18px); line-height:1.28; }
    .scripture-source { margin-top:8px; font-size:clamp(12px,3.2vw,15px); letter-spacing:1.1px; }
    .today-event-time { font-size:clamp(19px,5vw,26px); }
    .today-event-note { font-size:clamp(16px,4.2vw,21px); }
  }

  @media (max-width:520px) and (orientation:portrait) {
    .header { grid-template-columns:1fr; }
    .brand { max-height:104px; }
    .time-card { min-height:112px; }
    .clock { font-size:clamp(58px,17vw,84px); }
    .date-card { min-height:126px; }
    .hero { min-height:390px; }
    .today-title { font-size:clamp(24px,7.8vw,33px); }
  }

  /* Prominent Today panel layout for event and empty days. */
  .hero.event-day,
  .hero.empty-day { justify-content:flex-start; }

  .hero.event-day .today-copy,
  .hero.empty-day .today-copy {
    position:static; max-width:100%; width:100%; padding:145px 0 0;
    align-items:center; justify-content:flex-start; text-align:center;
  }

  .hero.event-day .today-title,
  .hero.empty-day .today-title {
    position:absolute; z-index:4; top:18px; left:50%; transform:translateX(-50%);
    width:76%; min-height:132px; padding:26px 36px;
    display:flex; align-items:center; justify-content:center;
    align-self:auto; text-align:center; font-size:60px;
  }

  .hero.event-day .today-events {
    width:100%; max-width:1100px; margin:18px auto 0;
    font-size:112px; line-height:1.06; text-align:center;
  }

  /* Fill the Today panel so event rows use the space above the fixed quote area. */
  .hero.event-day .today-copy {
    flex:1 1 auto; min-height:0; height:100%;
  }
  .hero.event-day .today-events {
    flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; justify-content:space-evenly;
  }
  .hero.event-day .today-events .event-line {
    flex:1 1 auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .hero.event-day .today-events .scripture-quote,
  .hero.event-day .today-events .raksha-quote-card { flex:0 0 auto; }

  .hero.event-day .today-events.quote-medium,
  .hero.event-day .today-events.quote-long,
  .hero.event-day .today-events.quote-xlong {
    margin-top:14px; font-size:100px;
  }
  .hero.event-day .today-events.quote-medium .event-line,
  .hero.event-day .today-events.quote-long .event-line,
  .hero.event-day .today-events.quote-xlong .event-line { padding:9px 0 12px; }
  .hero.event-day .today-events.quote-medium .scripture-quote,
  .hero.event-day .today-events.quote-long .scripture-quote,
  .hero.event-day .today-events.quote-xlong .scripture-quote { margin-top:12px; }

  /* Multi-event days reserve a stable, readable area for the complete shlok. */
  .hero.event-day .today-events.multiple-events {
    margin-top:8px; font-size:84px; line-height:1.03;
  }
  .hero.event-day .today-events.multiple-events .event-line { padding:4px 0 8px; }
  .hero.event-day .today-events.multiple-events .santo-schedule-label {
    margin-bottom:5px; padding:4px 11px; font-size:20px;
  }
  .hero.event-day .today-events.multiple-events .today-event-time { margin-top:5px; font-size:28px; }
  .hero.event-day .today-events.multiple-events .today-event-note { margin-top:4px; font-size:22px; }
  .hero.event-day .today-events.multiple-events .scripture-quote {
    min-height:150px; margin-top:8px; padding:7px 14px;
  }

  /* Automatic safety tiers used only when unusually long content still exceeds a panel. */
  .hero.event-day .today-events.fit-tight { margin-top:4px; font-size:68px; }
  .hero.event-day .today-events.fit-tight .event-line { padding:3px 0 6px; }
  .hero.event-day .today-events.fit-tight .scripture-quote { min-height:138px; margin-top:5px; }
  .hero.event-day .today-events.fit-tight .scripture-quote.medium { font-size:27px; }
  .hero.event-day .today-events.fit-tight .scripture-quote.long { font-size:20px; }
  .hero.event-day .today-events.fit-tight .scripture-quote.xlong { font-size:16px; }
  .hero.event-day .today-events.fit-ultra { font-size:60px; }
  .hero.event-day .today-events.fit-ultra .santo-schedule-label { font-size:17px; }
  .hero.event-day .today-events.fit-ultra .today-event-time { font-size:23px; }
  .hero.event-day .today-events.fit-ultra .today-event-note { font-size:18px; }
  .hero.event-day .today-events.fit-ultra .scripture-quote { min-height:126px; }
  .hero.event-day .today-events.fit-ultra .scripture-quote.medium { font-size:24px; }
  .hero.event-day .today-events.fit-ultra .scripture-quote.long { font-size:18px; }
  .hero.event-day .today-events.fit-ultra .scripture-quote.xlong { font-size:15px; }

  .upcoming.fit-tight .next-label { font-size:42px; padding-bottom:9px; }

  .upcoming.fit-tight .next-event.multiple-events { font-size:49px; }
  .upcoming.fit-tight .next-event-item { flex:0 0 auto; padding:6px 0 8px; }
  .upcoming.fit-tight .next-date { margin-top:9px; padding-bottom:12px; font-size:32px; }
  .upcoming.fit-ultra { padding-top:20px; padding-bottom:20px; }
  .upcoming.fit-ultra .next-label { font-size:38px; }
  .upcoming.fit-ultra .next-event.multiple-events { font-size:44px; }
  .upcoming.fit-ultra .next-event-time { font-size:24px; }
  .upcoming.fit-ultra .next-event-note { font-size:20px; }
  .upcoming.fit-ultra .next-date { font-size:28px; }

  .hero.empty-day .today-events {
    width:100%; max-width:940px; margin:42px auto 0;

  @media (max-width:1200px) and (orientation:portrait) {
    .hero.event-day,
    .hero.empty-day { justify-content:flex-start; }
    .hero.event-day .today-copy,
    .hero.empty-day .today-copy {
      position:static; width:100%; padding:122px 0 0; align-items:center;
    }
    .hero.event-day .today-title,
    .hero.empty-day .today-title {
      top:0; width:calc(100% - 28px); min-height:100px; padding:18px 16px;
      font-size:clamp(30px,8vw,40px); white-space:normal;

    .hero.event-day .today-events {
      width:100%; margin:30px auto 0; font-size:clamp(58px,15vw,82px);

    .hero.event-day .today-events.quote-long,

      width:100%; margin:28px auto 0; font-size:clamp(30px,8vw,44px);
    }

    --bg:#fff8ec;
    --panel:#fffaf3;
    --panel2:#fff3e2;
    --gold:#c98317;
    --gold2:#9d5b15;
    --pink:#c74470;
    --pink2:#9e2d59;
    --cream:#552438;
    --muted:#785f66;
    --line:rgba(175,105,35,.30);
    color:#54263a;
    background:
      linear-gradient(rgba(255,248,236,.76),rgba(255,248,236,.76)),
      var(--rakhi-photo) center/cover no-repeat fixed,
      radial-gradient(circle at 7% 78%,#a32f5a 0 7px,#ffd778 8px 15px,#fff8ec 16px 23px,rgba(201,131,23,.78) 24px 28px,transparent 29px),
      radial-gradient(circle at 93% 30%,#a32f5a 0 7px,#ffd778 8px 15px,#fff8ec 16px 23px,rgba(201,131,23,.78) 24px 28px,transparent 29px),
      radial-gradient(circle at 18% 14%,rgba(240,184,84,.22),transparent 27%),
      radial-gradient(circle at 84% 88%,rgba(199,68,112,.15),transparent 30%),
      linear-gradient(135deg,#fffaf1 0%,#fff4e5 48%,#fff9ef 100%);
  }
  body.raksha-bandhan-day .screen::before {
    height:3px; border-radius:4px; opacity:.78;
    background:linear-gradient(90deg,transparent,#c74470 20%,#e5b64e 50%,#c74470 80%,transparent);
  }
  body.raksha-bandhan-day .screen::after {
    content:""; position:absolute; z-index:0; inset:0; pointer-events:none; opacity:.22;
    background:
      linear-gradient(90deg,transparent 0 17%,#b83764 17.05% 17.15%,transparent 17.2% 82.8%,#b83764 82.85% 82.95%,transparent 83%),
      radial-gradient(circle at 17.1% 87%,#a62e59 0 8px,#f4c75b 9px 20px,transparent 21px 29px,#c74470 30px 34px,transparent 35px),
      radial-gradient(circle at 82.9% 87%,#a62e59 0 8px,#f4c75b 9px 20px,transparent 21px 29px,#c74470 30px 34px,transparent 35px);
  }
  body.raksha-bandhan-day .screen > * { position:relative; z-index:1; }
  body.raksha-bandhan-day .brand { filter:drop-shadow(0 6px 16px rgba(104,55,30,.18)); }
  body.raksha-bandhan-day .time-card::before {
    background:radial-gradient(circle at 50% 35%,rgba(229,182,78,.20),transparent 68%),rgba(255,255,255,.72);
    border-color:rgba(184,112,38,.30); box-shadow:inset 0 1px 0 #fff,0 16px 34px rgba(128,76,36,.12);
  }
  body.raksha-bandhan-day .time-card::after { background:linear-gradient(90deg,transparent,#c74470,#e5b64e,#c74470,transparent); }
  body.raksha-bandhan-day .clock { color:#64283f; text-shadow:0 0 24px rgba(229,182,78,.24),0 5px 18px rgba(116,69,37,.13); }
  body.raksha-bandhan-day .date-card {
    color:#552438; border-color:rgba(199,68,112,.28);
    background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(255,236,213,.78));
    box-shadow:inset 4px 0 0 #c74470,0 16px 34px rgba(128,76,36,.12);
  }
  body.raksha-bandhan-day .day-name { color:#9e2d59; }
  body.raksha-bandhan-day .full-date { color:#5b3441; }
  body.raksha-bandhan-day .tz { color:#9d5b15; }
  body.raksha-bandhan-day .hero {
    border-color:rgba(184,112,38,.36);
    background:
      radial-gradient(circle at 92% 52%,rgba(229,182,78,.18),transparent 30%),
      linear-gradient(145deg,rgba(255,255,255,.76),rgba(255,241,222,.80)),
      var(--rakhi-photo) center 58%/cover no-repeat;
    box-shadow:inset 5px 0 0 rgba(199,68,112,.76),0 18px 42px rgba(128,76,36,.10);
  }
  body.raksha-bandhan-day .hero::after { display:none; }
  body.raksha-bandhan-day .today-title {
    color:#64283f; border-color:rgba(199,68,112,.38);
    background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(255,226,198,.78));
    box-shadow:inset 5px 0 0 #c74470,0 12px 28px rgba(128,76,36,.12);
    text-shadow:none;
  }
  body.raksha-bandhan-day .hero.event-day .today-copy { padding-top:145px; }
  body.raksha-bandhan-day .hero.event-day .today-title { min-height:112px; }
  body.raksha-bandhan-day .hero.event-day .today-events {
    margin-top:20px; max-width:1120px; color:#5c2b3e; font-size:88px; line-height:1.02;
    text-shadow:0 4px 16px rgba(128,76,36,.10);
  }
  body.raksha-bandhan-day .today-events .event-line { padding:7px 0 11px; border-color:rgba(158,45,89,.13); }
  body.raksha-bandhan-day .today-events.quote-positioned { border-bottom-color:rgba(158,45,89,.24); }
  body.raksha-bandhan-day .today-events .event-line.raksha-event .today-event-name { color:#a12f5b; }
  body.raksha-bandhan-day .upcoming {
    border-color:rgba(199,68,112,.28);
    background:
      linear-gradient(160deg,rgba(255,255,255,.84),rgba(255,235,213,.88)),
      var(--rakhi-photo) 72% center/cover no-repeat;
    box-shadow:0 18px 42px rgba(128,76,36,.10);
  }
  body.raksha-bandhan-day .next-label { color:#9e2d59; border-bottom-color:#9e2d59; }
  body.raksha-bandhan-day .next-event { color:#5b2a3e; }
  body.raksha-bandhan-day .next-event-item { border-bottom-color:rgba(158,45,89,.20); }
  body.raksha-bandhan-day .next-event-time { color:#9d5b15; }
  body.raksha-bandhan-day .next-event-note { color:#765761; }
  body.raksha-bandhan-day .today-event-time { color:#9d5b15; }
  body.raksha-bandhan-day .today-event-note { color:#765761; }
  body.raksha-bandhan-day .next-date { color:#765761; }

  .raksha-quote-card {
    width:min(100%,970px); margin:12px auto 0; padding:18px 28px 20px;
    min-height:142px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:1px solid rgba(199,68,112,.27); border-radius:18px;
    background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(255,226,198,.76));
    box-shadow:inset 0 1px 0 #fff,0 12px 26px rgba(128,76,36,.10);
    color:#5e3342; font-size:30px; line-height:1.32; font-weight:400; text-align:center;
    opacity:1; transform:translateY(0);
    transition:opacity .48s ease,transform .58s cubic-bezier(.22,.8,.22,1);
  }
  .raksha-quote-card.is-leaving { opacity:0; transform:translateY(-12px); }
  .raksha-quote-card.is-entering { animation:rakshaQuoteIn .9s cubic-bezier(.18,.82,.2,1) both; }
  .raksha-quote-label { color:#9e2d59; font-size:14px; font-weight:700; letter-spacing:2.2px; text-transform:uppercase; }
  .raksha-quote-text { display:block; margin-top:7px; font-style:italic; }
  .raksha-quote-count { display:block; margin-top:6px; color:#9d5b15; font-size:13px; font-weight:700; letter-spacing:1px; }
  @keyframes rakshaQuoteIn {
    0% { opacity:0; transform:translateY(16px); }
    60% { opacity:.86; }
    100% { opacity:1; transform:translateY(0); }
  }
  @media (max-width:1200px) and (orientation:portrait) {
    body.raksha-bandhan-day .hero { min-height:590px; }
    body.raksha-bandhan-day .hero.event-day .today-copy { padding-top:112px; }
    body.raksha-bandhan-day .hero.event-day .today-title { min-height:92px; }
    body.raksha-bandhan-day .hero.event-day .today-events { margin-top:20px; font-size:clamp(45px,11.8vw,68px); }
    body.raksha-bandhan-day .today-events .event-line { padding:7px 0 10px; }
    .raksha-quote-card { margin-top:12px; padding:17px 16px 18px; font-size:clamp(20px,5.2vw,27px); line-height:1.36; }
    .raksha-quote-card { min-height:164px; }
    .raksha-quote-label { font-size:clamp(12px,3.2vw,14px); letter-spacing:1.4px; }
    .raksha-quote-count { font-size:12px; }
  }
  @media (prefers-reduced-motion:reduce) {
    .raksha-quote-card { transition:opacity .2s ease; }
    .raksha-quote-card.is-leaving { transform:none; }
    .raksha-quote-card.is-entering { animation:none; }
  }

  body.prasannatma-shibir-day .time-card::after {
    background:linear-gradient(90deg,transparent,#7a4bd6,#f6c85f,#7a4bd6,transparent);
  }
  body.prasannatma-shibir-day .clock {
    color:#fff7d1; text-shadow:0 0 34px rgba(246,200,95,.42),0 8px 24px rgba(0,0,0,.64);
  }
  body.prasannatma-shibir-day .date-card {
    border-color:rgba(246,200,95,.34);
    background:linear-gradient(135deg,rgba(25,15,71,.80),rgba(4,13,43,.80));
    box-shadow:inset 4px 0 0 #8c64e8,0 16px 38px rgba(0,0,0,.32);
  }
  body.prasannatma-shibir-day .day-name { color:#ffe59a; }
  body.prasannatma-shibir-day .full-date { color:#fff9df; }
  body.prasannatma-shibir-day .hero {
    border-color:rgba(246,200,95,.42);
    background:
      linear-gradient(145deg,rgba(3,9,35,.64),rgba(11,8,43,.78)),
      radial-gradient(circle at 50% 58%,rgba(255,237,161,.56) 0 7%,rgba(246,200,95,.20) 19%,transparent 47%),
      linear-gradient(145deg,#09113b,#17083d);
    box-shadow:inset 5px 0 0 rgba(122,75,214,.78),0 20px 48px rgba(0,0,0,.34);
  }
  body.prasannatma-shibir-day .hero::before {
    content:""; position:absolute; z-index:1; left:50%; top:53%; width:760px; height:760px;
    transform:translate(-50%,-50%); border-radius:50%; pointer-events:none; opacity:.72;
    background:
      radial-gradient(circle,rgba(255,250,215,.26) 0 9%,rgba(246,200,95,.12) 22%,transparent 51%),
      repeating-radial-gradient(circle,transparent 0 46px,rgba(255,226,126,.08) 48px 50px,transparent 52px 78px);
  }
  body.prasannatma-shibir-day .hero::after {
    width:520px; height:150px; right:-38px; bottom:-54px; border:0; border-radius:50%; opacity:.38;
    background:
      radial-gradient(ellipse at 50% 100%,#6d3bc8 0 15%,transparent 16%),
      radial-gradient(ellipse at 20% 100%,#4e2a98 0 18%,transparent 19%),
      radial-gradient(ellipse at 80% 100%,#4e2a98 0 18%,transparent 19%);
  }
  body.prasannatma-shibir-day .today-title {
    color:#fff4bd; border-color:rgba(246,200,95,.54);
    background:linear-gradient(135deg,rgba(58,29,120,.82),rgba(4,15,50,.84));
    box-shadow:inset 5px 0 0 #f6c85f,0 12px 32px rgba(0,0,0,.34);
    text-shadow:0 4px 20px rgba(0,0,0,.52);
  }
  body.prasannatma-shibir-day .hero.event-day .today-copy { padding-top:132px; }
  body.prasannatma-shibir-day .hero.event-day .today-title { min-height:112px; }
  body.prasannatma-shibir-day .hero.event-day .today-events {
    max-width:1120px; margin-top:6px; color:#fff7d7; text-shadow:0 5px 22px rgba(0,0,0,.68);
  }
  body.prasannatma-shibir-day .today-events .event-line.shibir-event {
    padding:4px 0 12px; border-color:rgba(246,200,95,.26);
  }
  body.prasannatma-shibir-day .santo-schedule-label {
    color:#ffe59a; border-color:rgba(246,200,95,.52); background:rgba(63,33,126,.64);
  }
  .shibir-event-name {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:100%; margin:0 auto; line-height:1; text-transform:uppercase;
  }
  .shibir-title-art {
    display:block; width:min(100%,820px); aspect-ratio:519 / 150; margin:0 auto;
    background-image:var(--shibir-title-art); background-position:center; background-repeat:no-repeat; background-size:contain;
    filter:drop-shadow(0 8px 24px rgba(0,0,0,.38));
  }
  body.prasannatma-shibir-day .today-event-time { margin-top:12px; color:#ffe59a; font-size:34px; }
  body.prasannatma-shibir-day .today-event-note { margin-top:6px; color:#f3e8c4; font-size:27px; }
  body.prasannatma-shibir-day .scripture-quote {
    min-height:130px; margin-top:10px; padding-top:8px; padding-bottom:8px;
    color:#f4eedb; text-shadow:0 4px 18px rgba(0,0,0,.72); border-top:1px solid rgba(246,200,95,.12);
  }
  body.prasannatma-shibir-day .scripture-source { color:#ffe08a; }
  body.prasannatma-shibir-day .today-events.fit-tight .shibir-title-art { width:min(100%,760px); }
  body.prasannatma-shibir-day .today-events.fit-tight .today-event-time { font-size:31px; }
  body.prasannatma-shibir-day .today-events.fit-tight .today-event-note { font-size:24px; }
  body.prasannatma-shibir-day .today-events.fit-ultra .shibir-title-art { width:min(100%,700px); }
  body.prasannatma-shibir-day .today-events.fit-ultra .today-event-time { font-size:28px; }
  body.prasannatma-shibir-day .today-events.fit-ultra .today-event-note { font-size:22px; }
  body.prasannatma-shibir-day .upcoming {
    border-color:rgba(246,200,95,.34);
    background:linear-gradient(160deg,rgba(10,10,45,.91),rgba(4,13,39,.94));
    box-shadow:inset 3px 0 0 rgba(107,53,201,.50),0 18px 44px rgba(0,0,0,.30);
  }
  body.prasannatma-shibir-day .next-label { color:#ffe59a; border-bottom-color:#f6c85f; }
  body.prasannatma-shibir-day .next-event { color:#fff8df; }
  body.prasannatma-shibir-day .next-event-item { border-bottom-color:rgba(246,200,95,.18); }
  body.prasannatma-shibir-day .next-event-time { color:#d0bbff; }
  body.prasannatma-shibir-day .next-event-note,
  body.prasannatma-shibir-day .next-date { color:#d2cbe5; }

  @media (max-width:1200px) and (orientation:portrait) {
    body.prasannatma-shibir-day .hero { min-height:650px; }
    body.prasannatma-shibir-day .hero.event-day .today-copy { padding-top:106px; }
    body.prasannatma-shibir-day .hero.event-day .today-title { min-height:92px; }
    body.prasannatma-shibir-day .hero.event-day .today-events { margin-top:16px; }
    .shibir-title-art { width:min(100%,600px); }
    body.prasannatma-shibir-day .today-event-time { font-size:clamp(23px,6vw,31px); }
    body.prasannatma-shibir-day .today-event-note { font-size:clamp(19px,5vw,25px); }
  }

  body.janmashtami-day .screen {
    background-image:
      linear-gradient(90deg,rgba(1,8,27,.10),rgba(1,10,31,.04) 58%,rgba(0,7,24,.12)),
      var(--janmashtami-bg);
    background-position:center; background-repeat:no-repeat; background-size:cover;
  }
  body.janmashtami-day .screen::before {
    height:3px; border-radius:4px; opacity:.92;
    background:linear-gradient(90deg,transparent,#24b9ac 17%,#ffd66f 50%,#24b9ac 83%,transparent);
  }
  body.janmashtami-day .screen::after {
    content:""; position:absolute; z-index:0; inset:0; pointer-events:none;
    background:linear-gradient(180deg,rgba(0,8,27,.04),rgba(0,8,27,.14));
  }
  body.janmashtami-day .screen > * { position:relative; z-index:1; }
  body.janmashtami-day .brand {
    filter:drop-shadow(0 0 18px rgba(103,230,213,.20)) drop-shadow(0 7px 19px rgba(0,0,0,.62));
  }
  body.janmashtami-day .time-card::before {
    border-color:rgba(255,214,111,.38);
    background:radial-gradient(circle at 50% 38%,rgba(103,230,213,.14),transparent 68%),rgba(1,13,39,.88);
    box-shadow:inset 0 1px 0 rgba(255,246,196,.10),0 18px 42px rgba(0,0,0,.36);
  }
  body.janmashtami-day .time-card::after {
    background:linear-gradient(90deg,transparent,#20b8aa,#ffd66f,#20b8aa,transparent);
  }
  body.janmashtami-day .clock {
    color:#fff8d9; text-shadow:0 0 34px rgba(103,230,213,.30),0 8px 24px rgba(0,0,0,.66);
  }
  body.janmashtami-day .date-card {
    border-color:rgba(255,214,111,.34);
    background:linear-gradient(135deg,rgba(3,42,70,.92),rgba(2,13,42,.93));
    box-shadow:inset 4px 0 0 #27b9ac,0 16px 38px rgba(0,0,0,.34);
  }
  body.janmashtami-day .day-name { color:#ffe18a; }
  body.janmashtami-day .full-date { color:#fffbe8; }
  body.janmashtami-day .hero {
    border-color:rgba(255,214,111,.44);
    background:linear-gradient(145deg,rgba(1,13,40,.80),rgba(2,38,60,.78) 55%,rgba(2,10,34,.84));
    box-shadow:inset 5px 0 0 rgba(32,184,170,.76),0 20px 48px rgba(0,0,0,.35);
  }
  body.janmashtami-day .hero::before {
    display:none;
  }
  body.janmashtami-day .hero::after {
    display:none;
  }
  body.janmashtami-day .today-title {
    color:#fff4b8; border-color:rgba(255,214,111,.58);
    background:linear-gradient(135deg,rgba(7,65,88,.90),rgba(3,18,55,.90));
    box-shadow:inset 5px 0 0 #ffd66f,0 12px 32px rgba(0,0,0,.36);
    text-shadow:0 4px 20px rgba(0,0,0,.54);
  }
  body.janmashtami-day .hero.event-day .today-copy { padding-top:124px; }
  body.janmashtami-day .hero.event-day .today-title { min-height:108px; }
  body.janmashtami-day .hero.event-day .today-events.janmashtami-program {
    max-width:1140px; margin:4px auto 0; gap:7px; justify-content:flex-start;
    color:#fffbe8; font-size:25px; line-height:1.22; text-shadow:0 4px 18px rgba(0,0,0,.62);
  }
  .janmashtami-heading {
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    width:100%; flex:0 0 auto;
  }
  .janmashtami-heading .santo-schedule-label {
    margin:0 auto 3px; color:#9af3e7; border-color:rgba(103,230,213,.58); background:rgba(11,71,88,.72);
  }
  .janmashtami-event-name {
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    column-gap:.24em; row-gap:.02em;
    color:#ffe18a; font-size:64px; line-height:1.02; font-weight:700; letter-spacing:.3px;
    text-align:center; text-shadow:0 0 24px rgba(255,214,111,.22),0 5px 18px rgba(0,0,0,.62);
  }
  .janmashtami-title-word,
  .janmashtami-title-word > span { display:inline-block; }
  .janmashtami-schedule-title {
    color:#a8f4e9; font-size:21px; line-height:1.15; font-weight:700; letter-spacing:2.2px; text-transform:uppercase;
  }
  .janmashtami-timeline {
    width:100%; min-height:0; display:grid; gap:7px; flex:1 1 auto; align-content:center;
  }
  .janmashtami-row {
    display:grid; grid-template-columns:244px minmax(0,1fr); column-gap:18px; align-items:center;
    min-height:54px; padding:8px 15px; border:1px solid rgba(103,230,213,.16); border-radius:13px;
    background:linear-gradient(90deg,rgba(4,48,68,.91),rgba(2,16,45,.89));
    box-shadow:inset 3px 0 0 rgba(255,214,111,.72);
  }
  .janmashtami-time {
    color:#ffe69a; font-size:24px; line-height:1.16; font-weight:700; text-align:left; white-space:nowrap;
  }
  .janmashtami-icon { display:inline-block; width:32px; text-align:center; margin-right:5px; }
  .janmashtami-detail {
    color:#fff; font-size:26px; line-height:1.18; font-weight:700; text-align:left;
  }
  .janmashtami-note {
    grid-column:2; margin-top:4px; color:#cce9e6; font-size:18px; line-height:1.18;
    font-style:italic; font-weight:400; text-align:left;
  }
  .janmashtami-observances {
    flex:0 0 auto; color:#e1edf3; font-size:24px; line-height:1.2; font-weight:700; text-align:center;
  }
  body.janmashtami-day .upcoming {
    border-color:rgba(255,214,111,.35);
    background:linear-gradient(160deg,rgba(2,17,47,.86),rgba(2,36,54,.85));
    box-shadow:inset 3px 0 0 rgba(32,184,170,.58),0 18px 44px rgba(0,0,0,.32);
  }
  body.janmashtami-day .next-label { color:#ffe18a; border-bottom-color:#2ec7b8; }
  body.janmashtami-day .next-date { color:#ecf8f5; border-bottom-color:rgba(103,230,213,.20); }
  body.janmashtami-day .next-event { color:#fff8df; }
  body.janmashtami-day .next-event-item { border-bottom-color:rgba(103,230,213,.17); }
  body.janmashtami-day .next-event-time { color:#ffe18a; }
  body.janmashtami-day .next-event-note { color:#c8e5e1; }

  /* Janmashtami-only motion: lightweight effects chosen for TV browser stability. */
  body.janmashtami-day .screen {
    animation:janmashtamiBackgroundDrift 28s ease-in-out infinite;
  }
  body.janmashtami-day .screen::before {
    z-index:2; pointer-events:none;
    animation:janmashtamiDividerGlow 4.8s ease-in-out infinite;
  }
  body.janmashtami-day .screen::after {
    inset:0;
    background-image:
      radial-gradient(circle,rgba(255,222,128,.54) 0 2px,transparent 3px),
      radial-gradient(circle,rgba(103,230,213,.40) 0 2px,transparent 3px),
      radial-gradient(circle,rgba(255,222,128,.30) 0 1.5px,transparent 2.5px),
      linear-gradient(180deg,rgba(0,8,27,.04),rgba(0,8,27,.14));
    background-size:430px 430px,590px 590px,330px 330px,100% 100%;
    background-position:12px 24px,170px 92px,86px 210px,0 0;
    background-repeat:repeat,repeat,repeat,no-repeat;
    animation:janmashtamiLightDrift 18s linear infinite;
  }
  body.janmashtami-day .today-title {
    animation:
      janmashtamiPanelGlow 5.2s ease-in-out infinite,
      janmashtamiHeaderText 6.4s ease-in-out infinite;
  }
  body.janmashtami-day .janmashtami-title-word {
    opacity:0;
    animation:janmashtamiWordReveal .9s cubic-bezier(.16,.82,.22,1) forwards;
  }
  body.janmashtami-day .janmashtami-title-word:nth-child(1) { animation-delay:.10s; }
  body.janmashtami-day .janmashtami-title-word:nth-child(2) { animation-delay:.28s; }
  body.janmashtami-day .janmashtami-title-word:nth-child(3) { animation-delay:.46s; }
  body.janmashtami-day .janmashtami-title-word > span { animation:janmashtamiWordShimmer 6.6s ease-in-out infinite; }
  body.janmashtami-day .janmashtami-title-word:nth-child(1) > span { animation-delay:.80s; }
  body.janmashtami-day .janmashtami-title-word:nth-child(2) > span { animation-delay:1.52s; }
  body.janmashtami-day .janmashtami-title-word:nth-child(3) > span { animation-delay:2.24s; }
  body.janmashtami-day .next-label {
    animation:janmashtamiLabelGlow 5.2s ease-in-out infinite;
  }
  body.janmashtami-day .janmashtami-row {
    opacity:0;
    animation:
      janmashtamiRowRevealLeft .78s cubic-bezier(.20,.76,.22,1) forwards,
      janmashtamiRowGlow 12s ease-in-out infinite;
  }
  body.janmashtami-day .janmashtami-row:nth-child(even) {
    animation-name:janmashtamiRowRevealRight,janmashtamiRowGlow;
  }
  body.janmashtami-day .janmashtami-row:nth-child(1) { --spotlight-delay:0s; animation-delay:.08s,0s; }
  body.janmashtami-day .janmashtami-row:nth-child(2) { --spotlight-delay:2.2s; animation-delay:.18s,2.2s; }
  body.janmashtami-day .janmashtami-row:nth-child(3) { --spotlight-delay:4.4s; animation-delay:.28s,4.4s; }
  body.janmashtami-day .janmashtami-row:nth-child(4) { --spotlight-delay:6.6s; animation-delay:.38s,6.6s; }
  body.janmashtami-day .janmashtami-row:nth-child(5) { --spotlight-delay:8.8s; animation-delay:.48s,8.8s; }
  body.janmashtami-day .janmashtami-time {
    transform-origin:left center;
    animation:janmashtamiTimeSpotlight 12s ease-in-out var(--spotlight-delay,0s) infinite;
  }
  body.janmashtami-day .janmashtami-detail {
    animation:janmashtamiDetailSpotlight 12s ease-in-out var(--spotlight-delay,0s) infinite;
  }
  body.janmashtami-day .janmashtami-note {
    animation:janmashtamiNoteSpotlight 12s ease-in-out var(--spotlight-delay,0s) infinite;
  }
  body.janmashtami-day .janmashtami-icon {
    animation:janmashtamiIconFloat 3.6s ease-in-out infinite;
  }
  body.janmashtami-day .janmashtami-row:nth-child(even) .janmashtami-icon {
    animation-delay:-1.8s;
  }
  body.janmashtami-day .janmashtami-observances {
    animation:janmashtamiObservanceGlow 6s ease-in-out infinite;
  }

  @keyframes janmashtamiBackgroundDrift {
    0%,100% { background-position:50% 50%; }
    50% { background-position:51% 49%; }
  }
  @keyframes janmashtamiLightDrift {
    0% { background-position:12px 24px,170px 92px,86px 210px,0 0; }
    50% { background-position:44px -34px,138px 38px,110px 152px,0 0; }

  .next-event.janmashtami-upcoming {
    margin-top:10px; gap:7px; justify-content:flex-start; overflow:hidden; font-size:20px; line-height:1.17;
  }
  .janmashtami-upcoming-head { flex:0 0 auto; text-align:center; }
  .janmashtami-upcoming-head .santo-schedule-label {
    margin:0 auto 5px; color:#9af3e7; border-color:rgba(103,230,213,.56); background:rgba(11,71,88,.72);
  }
  .janmashtami-upcoming-title { color:#ffe18a; font-size:44px; line-height:1.02; font-weight:700; }
  .janmashtami-upcoming-subtitle {
    margin-top:3px; color:#a8f4e9; font-size:17px; font-weight:700; letter-spacing:1.7px; text-transform:uppercase;

  .janmashtami-upcoming-list { display:grid; gap:6px; min-height:0; }

    display:grid; grid-template-columns:158px minmax(0,1fr); gap:9px; align-items:start;

  .janmashtami-upcoming-note {
    grid-column:2; color:#c8e5e1; font-size:15px; line-height:1.16; font-style:italic;
  }
  .janmashtami-upcoming-observances {
    color:#e1edf3; font-size:18px; line-height:1.16; font-weight:700; text-align:center;
  }
  .hero.event-day .today-events.janmashtami-program.fit-tight { margin-top:0; gap:5px; }

  .hero.event-day .today-events.janmashtami-program.fit-ultra .janmashtami-detail { font-size:21px; }
  .upcoming.fit-tight .next-event.janmashtami-upcoming { gap:5px; }

  .upcoming.fit-tight .janmashtami-upcoming-detail { font-size:17px; }

function parseDate(s) {
  const [d,m,y] = s.split('/').map(Number);
  return new Date(y, m-1, d, 0, 0, 0, 0);
}
function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtDate(d) {
  return new Intl.DateTimeFormat('en-NZ', {weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'Pacific/Auckland'}).format(d);
}
function fmtShort(d) {
  return new Intl.DateTimeFormat('en-NZ', {day:'numeric', month:'short', timeZone:'Pacific/Auckland'}).format(d);
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  }
  return '<div class="today-event-name">' + escapeHtml(event.event) + '</div>';
}

function janmashtamiObservances(events) {
  return events
    .filter(event => event.theme !== 'janmashtami')
    .map(event => event.event);
}

function janmashtamiTodayMarkup(events) {
  const observances = janmashtamiObservances(events);
  return '<div class="janmashtami-heading">' +
    '<div class="janmashtami-event-name" aria-label="Shree Krishna Janmashtami">' +
    '<span class="janmashtami-title-word"><span>Shree</span></span>' +
    '<span class="janmashtami-title-word"><span>Krishna</span></span>' +
    '<span class="janmashtami-title-word"><span>Janmashtami</span></span>' +
    '</div></div>' +
    '<div class="janmashtami-timeline">' + JANMASHTAMI_SCHEDULE.map(item =>
      '<div class="janmashtami-row">' +
      '<div class="janmashtami-time"><span class="janmashtami-icon" aria-hidden="true">' + escapeHtml(item.icon) + '</span>' + escapeHtml(item.time) + '</div>' +
      '<div class="janmashtami-detail">' + escapeHtml(item.detail) + '</div>' +
      (item.note ? '<div class="janmashtami-note">(' + escapeHtml(item.note) + ')</div>' : '') +
      '</div>'
    ).join('') + '</div>' +
    (observances.length ? '<div class="janmashtami-observances">Also observed: ' + escapeHtml(observances.join(' • ')) + '</div>' : '');
}

function janmashtamiUpcomingMarkup(events) {
  const observances = janmashtamiObservances(events);
  return '<div class="janmashtami-upcoming-head">' +
    '<div class="janmashtami-upcoming-title">Shree Krishna Janmashtami</div></div>' +
    '<div class="janmashtami-upcoming-list">' + JANMASHTAMI_SCHEDULE.map(item =>
      '<div class="janmashtami-upcoming-row">' +
      '<div class="janmashtami-upcoming-time">' + escapeHtml(item.time) + '</div>' +
      '<div class="janmashtami-upcoming-detail">' + escapeHtml(item.detail) + '</div>' +
      (item.note ? '<div class="janmashtami-upcoming-note">(' + escapeHtml(item.note) + ')</div>' : '') +
      '</div>'
    ).join('') + '</div>' +
    (observances.length ? '<div class="janmashtami-upcoming-observances">Also observed: ' + escapeHtml(observances.join(' • ')) + '</div>' : '');
}

const SHLOK_ROTATION_MS = 2 * 60 * 1000;
let activeShlokSlot = null;
let shlokTransitionToken = 0;
let lastTodayPanelKey = '';
let cachedShlokCycle = null;
let cachedShlokOrder = [];

function seededRandom(seed) {
  let state = seed >>> 0;
  return function() {
    state = (state + 0x6D2B79F5) >>> 0;
    let value = state;
    value = Math.imul(value ^ (value >>> 15), value | 1);
    value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
    return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffledShlokOrder(cycle) {
  if (cycle === cachedShlokCycle) return cachedShlokOrder;
  const order = Array.from({length:DAILY_SHLOKS.length}, (_, index) => index);
  const random = seededRandom((cycle ^ 0x9E3779B9) >>> 0);
  for (let index = order.length - 1; index > 0; index--) {
    const swapIndex = Math.floor(random() * (index + 1));
    [order[index], order[swapIndex]] = [order[swapIndex], order[index]];
  }
  cachedShlokCycle = cycle;
  cachedShlokOrder = order;
  return order;
}

function rotatingShlok(now) {
  const slot = Math.floor(now.getTime() / SHLOK_ROTATION_MS);
  const cycle = Math.floor(slot / DAILY_SHLOKS.length);
  const position = ((slot % DAILY_SHLOKS.length) + DAILY_SHLOKS.length) % DAILY_SHLOKS.length;
  const index = shuffledShlokOrder(cycle)[position];
  return {slot, shlok:DAILY_SHLOKS[index]};
}

function shlokLengthClass(text) {
  if (text.length > 650) return ' xlong';
  if (text.length > 260) return ' long';
  if (text.length > 150) return ' medium';
  return '';
}

function shlokShellHtml() {
  return '<div id="todayShlok" class="scripture-quote" aria-live="polite" aria-atomic="true">' +
    '<em id="todayShlokText"></em><span id="todayShlokSource" class="scripture-source"></span></div>';
}

function updateRotatingShlok(now, animate) {
  const state = rotatingShlok(now);
  const quote = document.getElementById('todayShlok');
  if (!quote || (state.slot === activeShlokSlot && document.getElementById('todayShlokText').textContent)) return;

  activeShlokSlot = state.slot;
  const token = ++shlokTransitionToken;
  const text = document.getElementById('todayShlokText');
  const source = document.getElementById('todayShlokSource');

  const reveal = () => {
    if (token !== shlokTransitionToken || !quote.isConnected) return;
    const lengthClass = shlokLengthClass(state.shlok.text);
    quote.className = 'scripture-quote' + lengthClass;
    const todayPanel = quote.closest('.today-events');
    if (todayPanel) {
      todayPanel.classList.remove('quote-medium','quote-long','quote-xlong');
      if (lengthClass) todayPanel.classList.add('quote-' + lengthClass.trim());
    }
    text.textContent = '“' + state.shlok.text + '”';
    source.textContent = '— Shikshapatri Shlok ' + state.shlok.number;
    scheduleDashboardPanelFit();
    if (animate) {
      quote.classList.add('is-entering');
      quote.addEventListener('animationend', () => quote.classList.remove('is-entering'), {once:true});
    }
  };

  if (animate && text.textContent) {
    quote.classList.remove('is-entering');
    quote.classList.add('is-leaving');
    window.setTimeout(reveal, 520);
  } else {
    reveal();
  }
}

const RAKSHA_QUOTE_ROTATION_MS = 12 * 1000;
let activeRakshaQuoteSlot = null;
let rakshaTransitionToken = 0;

function rakshaQuoteShellHtml() {
  return '<div id="rakshaQuote" class="raksha-quote-card" aria-live="polite" aria-atomic="true">' +
    '<span class="raksha-quote-label">Rakshabandhan Blessing</span>' +
    '<em id="rakshaQuoteText" class="raksha-quote-text"></em>' +
    '<span id="rakshaQuoteCount" class="raksha-quote-count"></span></div>';
}

function updateRakshaQuote(now, animate) {
  const slot = Math.floor(now.getTime() / RAKSHA_QUOTE_ROTATION_MS);
  const quote = document.getElementById('rakshaQuote');
  const text = document.getElementById('rakshaQuoteText');
  const count = document.getElementById('rakshaQuoteCount');
  if (!quote || !text || !count || (slot === activeRakshaQuoteSlot && text.textContent)) return;

  activeRakshaQuoteSlot = slot;
  const token = ++rakshaTransitionToken;
  const index = ((slot % RAKSHA_QUOTES.length) + RAKSHA_QUOTES.length) % RAKSHA_QUOTES.length;
  const reveal = () => {
    if (token !== rakshaTransitionToken || !quote.isConnected) return;
    quote.className = 'raksha-quote-card';
    text.textContent = '“' + RAKSHA_QUOTES[index] + '”';
    count.textContent = (index + 1) + ' / ' + RAKSHA_QUOTES.length;
    scheduleDashboardPanelFit();
    if (animate) {
      quote.classList.add('is-entering');
      quote.addEventListener('animationend', () => quote.classList.remove('is-entering'), {once:true});
    }
  };

  if (animate && text.textContent) {
    quote.classList.remove('is-entering');
    quote.classList.add('is-leaving');
    window.setTimeout(reveal, 520);
  } else {
    reveal();
  }
}

function aucklandDateKey(now) {
  const previewDate = dashboardPreviewDate();
  if (previewDate) return previewDate;
  const parts = new Intl.DateTimeFormat('en-CA', {
    year:'numeric', month:'2-digit', day:'2-digit', timeZone:'Pacific/Auckland'
  }).formatToParts(now).reduce((result, part) => {
    if (part.type !== 'literal') result[part.type] = part.value;
    return result;
  }, {});
  return parts.year + '-' + parts.month + '-' + parts.day;
}

function dateFromKey(key) {
  const [year, month, day] = key.split('-').map(Number);
  return new Date(year, month - 1, day, 0, 0, 0, 0);
}

function dashboardPreviewDate() {
  const queryDate = new URLSearchParams(window.location.search).get('previewDate');
  const requestedDate = queryDate || document.body.dataset.previewDate || '';
  return /^\d{4}-\d{2}-\d{2}$/.test(requestedDate) ? requestedDate : '';
}

function aucklandNow() {
  const previewDate = dashboardPreviewDate();
  if (previewDate) {
    const [year, month, day] = previewDate.split('-').map(Number);
    return new Date(Date.UTC(year, month - 1, day, 0, 0, 0));
  }
  // The browser/Yodeck device should be configured to Auckland time.
  return new Date();
}
function daysUntil(target, now) {
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const b = new Date(target.getFullYear(), target.getMonth(), target.getDate());
  return Math.round((b-a)/86400000);
}

function render() {
  const now = aucklandNow();
  const today = aucklandDateKey(now);
  const todayDate = dateFromKey(today);
  const isRakshaBandhan = today === '2026-08-28';
  const isJanmashtami = today === JANMASHTAMI_DATE;
  const isPrasannatmaShibir = today === '2026-09-06';
  const rotatingThemes = ['theme-amber','theme-royal','theme-lotus','theme-teal'];
  const themeIndex = [...today].reduce((sum,ch) => sum + ch.charCodeAt(0), 0) % rotatingThemes.length;
  const activeTheme = isRakshaBandhan
    ? 'raksha-bandhan-day'
    : isJanmashtami
      ? 'janmashtami-day'
      : isPrasannatmaShibir
        ? 'prasannatma-shibir-day'
        : rotatingThemes[themeIndex];
  if (!document.body.classList.contains(activeTheme)) {
    document.body.classList.remove('raksha-bandhan-day','janmashtami-day','prasannatma-shibir-day', ...rotatingThemes);
    document.body.classList.add(activeTheme);
  }
  const calendarEvents = [
    ...EVENTS.filter(event => !SANTO_SCHEDULE_REPLACEMENTS.has(event.date + '|' + event.event)),
    ...SANTO_SCHEDULE
  ];
  const parsed = calendarEvents.map(e => ({...e, dt:parseDate(e.date)})).sort((a,b) =>
    a.dt - b.dt || Number(Boolean(b.time)) - Number(Boolean(a.time))
  );

  const todayEvents = parsed.filter(e => dateKey(e.dt) === today);
  const future = parsed.filter(e => e.dt > todayDate);
  const next = future[0];
  const nextEvents = next ? future.filter(e => dateKey(e.dt) === dateKey(next.dt)) : [];

  document.getElementById('clock').textContent =
    new Intl.DateTimeFormat('en-NZ', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true, timeZone:'Pacific/Auckland'}).format(now);
  document.getElementById('dayName').textContent =
    new Intl.DateTimeFormat('en-NZ', {weekday:'long', timeZone:'Pacific/Auckland'}).format(now);
  document.getElementById('fullDate').textContent =
    new Intl.DateTimeFormat('en-NZ', {day:'numeric', month:'long', year:'numeric', timeZone:'Pacific/Auckland'}).format(now);

  const hero = document.querySelector('.hero');
  hero.classList.remove('event-day','empty-day');
  const todayPanelKey = today + '|' + todayEvents.map(e => [e.source || '',e.event,e.time || '',e.note || ''].join('~')).join('|') +
    (isJanmashtami ? '|janmashtami-program-v1' : '');
  if (todayEvents.length) {
    hero.classList.add('event-day');
    document.getElementById('todayTitle').textContent = 'TODAY AT THE MANDIR';
    if (todayPanelKey !== lastTodayPanelKey) {
      const todayEventPanel = document.getElementById('todayEvents');
      if (isJanmashtami) {
        todayEventPanel.className = 'today-events janmashtami-program';
        todayEventPanel.innerHTML = janmashtamiTodayMarkup(todayEvents);
      } else {
        const displayEvents = isRakshaBandhan
          ? [...todayEvents].sort((a,b) => Number(b.event === 'Raksha Bandhan') - Number(a.event === 'Raksha Bandhan'))
          : todayEvents;
        todayEventPanel.className = 'today-events quote-positioned' +
          (displayEvents.length > 1 ? ' multiple-events' : '');
        todayEventPanel.innerHTML = displayEvents.map(e =>
          '<div class="event-line' + (e.event === 'Raksha Bandhan' ? ' raksha-event' : '') + (e.theme === 'prasannatma-shibir' ? ' shibir-event' : '') + '">' +
          (e.source ? '<span class="santo-schedule-label">' + escapeHtml(e.source) + '</span>' : '') +
          todayEventNameMarkup(e) +
          (e.time ? '<div class="today-event-time">' + escapeHtml(e.time) + '</div>' : '') +
          (e.note ? '<div class="today-event-note">' + escapeHtml(e.note) + '</div>' : '') +
          '</div>'
        ).join('') + (isRakshaBandhan ? rakshaQuoteShellHtml() : shlokShellHtml());
      }
    }
  } else {
    hero.classList.add('empty-day');
    document.getElementById('todayTitle').textContent = 'NO EVENTS LISTED TODAY';
    if (todayPanelKey !== lastTodayPanelKey) {
      const todayEventPanel = document.getElementById('todayEvents');
      todayEventPanel.className = 'today-events quote-positioned';
      todayEventPanel.innerHTML = '<div class="event-line">Enjoy a blessed day of satsang and seva.</div>' + shlokShellHtml();
    }
  }

  if (todayPanelKey !== lastTodayPanelKey) {
    lastTodayPanelKey = todayPanelKey;
    activeShlokSlot = null;
    activeRakshaQuoteSlot = null;
    ++shlokTransitionToken;
    ++rakshaTransitionToken;
    if (isRakshaBandhan) updateRakshaQuote(now, false);
    else if (!isJanmashtami) updateRotatingShlok(now, false);
  } else {
    if (isRakshaBandhan) updateRakshaQuote(now, true);
    else if (!isJanmashtami) updateRotatingShlok(now, true);
  }

  if (next) {
    const d = daysUntil(next.dt, todayDate);
    const nextEventPanel = document.getElementById('nextEvent');
    const nextIsJanmashtami = dateKey(next.dt) === JANMASHTAMI_DATE;
    nextEventPanel.className = nextIsJanmashtami
      ? 'next-event janmashtami-upcoming'
      : 'next-event' +
        (nextEvents.length > 1 ? ' multiple-events' : '') +
        (nextEvents.length > 2 ? ' many-events' : '');
    const upcomingMarkup = nextIsJanmashtami
      ? janmashtamiUpcomingMarkup(nextEvents)
      : nextEvents.map(event =>
        '<div class="next-event-item">' +
        (event.source ? '<span class="santo-schedule-label">' + escapeHtml(event.source) + '</span>' : '') +
        escapeHtml(event.event) +
        (event.time ? '<span class="next-event-time">' + escapeHtml(event.time) + '</span>' : '') +
        (event.note ? '<span class="next-event-note">' + escapeHtml(event.note) + '</span>' : '') +
        '</div>'
      ).join('');
    if (nextEventPanel.innerHTML !== upcomingMarkup) nextEventPanel.innerHTML = upcomingMarkup;
    document.getElementById('nextDate').textContent = fmtDate(next.dt) +
      (d === 1 ? ' • Tomorrow' : ' • In ' + d + ' days');
  }
  scheduleDashboardPanelFit();
}

let dashboardFitFrame = 0;

function innerContentHeight(element) {
  const style = window.getComputedStyle(element);
  return element.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
}

function fitDashboardPanels() {
  dashboardFitFrame = 0;
  const todayPanel = document.getElementById('todayEvents');
  const upcomingPanel = document.querySelector('.upcoming');

  if (todayPanel) todayPanel.classList.remove('fit-tight','fit-ultra');
  if (upcomingPanel) upcomingPanel.classList.remove('fit-tight','fit-ultra');
  if (!document.body.classList.contains('tv-canvas')) return;

  const hero = document.querySelector('.hero');
  const todayCopy = document.querySelector('.today-copy');
  if (hero && todayCopy && todayPanel) {
    const available = innerContentHeight(hero);
    if (todayCopy.scrollHeight > available + 1) todayPanel.classList.add('fit-tight');
    if (todayCopy.scrollHeight > available + 1) todayPanel.classList.add('fit-ultra');
  }

  const nextWrap = document.querySelector('.next-wrap');
  if (upcomingPanel && nextWrap) {
    const available = innerContentHeight(upcomingPanel);
    if (nextWrap.scrollHeight > available + 1) upcomingPanel.classList.add('fit-tight');
    if (nextWrap.scrollHeight > available + 1) upcomingPanel.classList.add('fit-ultra');
  }
}

function scheduleDashboardPanelFit() {
  if (dashboardFitFrame) window.cancelAnimationFrame(dashboardFitFrame);
  dashboardFitFrame = window.requestAnimationFrame(fitDashboardPanels);
}

const DASHBOARD_DESIGN_WIDTH = 1920;
const DASHBOARD_DESIGN_HEIGHT = 1080;

function fitDashboardToViewport() {
  const screen = document.querySelector('.screen');
  if (!screen) return;

  const useTvCanvas = window.innerWidth > window.innerHeight || window.innerWidth > 1200;
  document.body.classList.toggle('tv-canvas', useTvCanvas);

  if (useTvCanvas) {
    const scale = Math.min(
      window.innerWidth / DASHBOARD_DESIGN_WIDTH,
      window.innerHeight / DASHBOARD_DESIGN_HEIGHT
    );
    screen.style.transform = 'scale(' + Math.max(scale, 0.1) + ')';
  } else {
    screen.style.removeProperty('transform');
  }
  scheduleDashboardPanelFit();
}

window.addEventListener('resize', fitDashboardToViewport, {passive:true});
window.addEventListener('orientationchange', fitDashboardToViewport, {passive:true});
fitDashboardToViewport();
render();
scheduleDashboardPanelFit();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleDashboardPanelFit);
setInterval(render, 1000);
</script>
