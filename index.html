<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080,initial-scale=1.0">
<title>SSMB Auckland — Event Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#050505;
    --panel:#111111;
    --panel2:#171717;
    --gold:#f6c945;
    --gold2:#ffdf69;
    --pink:#d94a96;
    --pink2:#f27abd;
    --cream:#fff8df;
    --muted:#a9a9a9;
    --line:rgba(246,201,69,.20);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:white; }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    background:
      radial-gradient(circle at 50% -15%, rgba(246,201,69,.11), transparent 34%),
      radial-gradient(circle at 90% 90%, rgba(217,74,150,.08), transparent 30%),
      #050505;
  }
  body.india-independence-day {
    --gold:#ff9933;
    --gold2:#ffb45f;
    --pink:#138808;
    --pink2:#55b85a;
    --line:rgba(255,153,51,.32);
    background:
      radial-gradient(circle at 50% -12%, rgba(255,255,255,.15), transparent 34%),
      linear-gradient(116deg, rgba(255,153,51,.17) 0 30%, rgba(255,255,255,.055) 43% 57%, rgba(19,136,8,.16) 70% 100%),
      #050505;
  }
  body.theme-royal { --gold:#74a7ff; --gold2:#a9c8ff; --pink:#8f62ff; --pink2:#bb9cff; --line:rgba(116,167,255,.30); background:radial-gradient(circle at 18% 20%,rgba(65,105,225,.18),transparent 35%),radial-gradient(circle at 86% 82%,rgba(143,98,255,.15),transparent 32%),#050508; }
  body.theme-lotus { --gold:#ffbf69; --gold2:#ffd39b; --pink:#e84f9b; --pink2:#ff86bf; --line:rgba(232,79,155,.28); background:radial-gradient(circle at 20% 18%,rgba(232,79,155,.16),transparent 35%),radial-gradient(circle at 88% 85%,rgba(255,191,105,.13),transparent 31%),#080507; }
  body.theme-teal { --gold:#63e6be; --gold2:#96f2d7; --pink:#22b8cf; --pink2:#66d9e8; --line:rgba(99,230,190,.27); background:radial-gradient(circle at 20% 18%,rgba(34,184,207,.16),transparent 35%),radial-gradient(circle at 88% 85%,rgba(99,230,190,.12),transparent 31%),#040807; }
  body.theme-amber { --gold:#f6c945; --gold2:#ffdf69; --pink:#d94a96; --pink2:#f27abd; --line:rgba(246,201,69,.20); }
  .screen {
    width:1920px; height:1080px; max-width:100vw; max-height:100vh;
    margin:auto; padding:38px 58px 34px;
    display:grid; grid-template-rows:222px 1fr 42px; gap:22px;
    position:relative;
  }
  .screen::before {
    content:""; position:absolute; left:58px; right:58px; top:260px;
    height:1px; background:linear-gradient(90deg,transparent,var(--gold),var(--pink),var(--gold),transparent);
    opacity:.65;
  }
  body.india-independence-day .screen::before {
    height:4px; border-radius:4px; opacity:.92;
    background:linear-gradient(90deg,#ff9933 0 33.33%,#ffffff 33.33% 66.66%,#138808 66.66% 100%);
  }
  .header { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
  .brand {
    width:650px; height:168px; object-fit:contain; object-position:left center;
    filter:drop-shadow(0 5px 18px rgba(0,0,0,.65));
  }
  .clockbox {
    position:relative;
    width:640px; padding:22px 0 20px; margin:0 auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .clockbox::before {
    content:""; position:absolute; inset:0;
    background: radial-gradient(circle at 50% 40%, rgba(246,201,69,.16), transparent 70%);
    border:1px solid var(--line); border-radius:26px; z-index:-1;
  }
  .clock {
    font-family:'Cinzel', Georgia, serif;
    font-size:90px; font-weight:700; line-height:1;
    font-variant-numeric:tabular-nums;
    letter-spacing:6px; margin-right:-6px;
    color:#ffffff;
    text-shadow:0 0 30px rgba(255,255,255,.35), 0 8px 22px rgba(0,0,0,.55);
  }
  .date { margin-top:14px; font-size:23px; color:var(--muted); letter-spacing:1.4px; text-align:center; }
  .tz { margin-top:8px; font-size:14px; color:var(--gold); letter-spacing:3px; text-transform:uppercase; text-align:center; }
  .header-right { text-align:right; }
  .live { display:inline-flex; align-items:center; gap:10px; font-size:16px; color:#ddd; letter-spacing:2px; text-transform:uppercase; }
  .dot { width:10px; height:10px; border-radius:50%; background:#6fe27f; box-shadow:0 0 14px #6fe27f; animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.35; transform:scale(.75); } }
  .main {
    display:grid; grid-template-columns:minmax(0,7fr) minmax(0,3fr); gap:28px; min-height:0;
  }
  .hero {
    border:1px solid var(--line); border-radius:28px; padding:36px 42px;
    background:
      radial-gradient(circle at 50% 0%, rgba(246,201,69,.15), transparent 52%),
      linear-gradient(145deg,#17130a,#0c0c0c 65%);
    display:flex; flex-direction:column; justify-content:center; position:relative; overflow:hidden;
  }
  .today-copy { position:relative; z-index:3; width:100%; max-width:980px; padding-right:22px; display:flex; flex-direction:column; justify-content:center; gap:20px; }
  body.india-independence-day .today-copy { width:51%; max-width:none; }
  .today-visual {
    position:absolute; z-index:2; top:24px; right:24px; bottom:24px; width:49%;
    display:none;
    border-radius:24px; overflow:hidden;
    background:linear-gradient(145deg,rgba(255,153,51,.22),rgba(255,255,255,.04) 50%,rgba(19,136,8,.20));
    box-shadow:-22px 0 50px rgba(0,0,0,.56), 0 14px 40px rgba(0,0,0,.42);
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 100%);
  }
  body.india-independence-day .today-visual { display:block; }
  .today-visual::after {
    content:""; position:absolute; inset:0;
    background:
      linear-gradient(180deg,rgba(255,153,51,.16),transparent 34%,rgba(19,136,8,.13)),
      linear-gradient(90deg,rgba(12,12,12,.55),transparent 30%);
    pointer-events:none;
  }
  .today-image { width:100%; height:100%; object-fit:cover; object-position:center 43%; display:block; }
  .hero::after {
    content:""; position:absolute; width:430px; height:430px; border:1px solid rgba(217,74,150,.18);
    border-radius:50%; right:-180px; bottom:-230px;
  }
  body.india-independence-day .hero {
    border-color:rgba(255,153,51,.58);
    background:
      radial-gradient(circle at 84% 50%, transparent 0 68px, rgba(0,0,128,.34) 69px 72px, transparent 73px),
      linear-gradient(145deg,rgba(255,153,51,.21),rgba(255,255,255,.045) 50%,rgba(19,136,8,.19)),
      #0c0c0c;
    box-shadow:inset 5px 0 0 #ff9933, inset -5px 0 0 #138808;
  }
  .eyebrow { color:var(--gold); font-size:17px; letter-spacing:3px; text-transform:uppercase; font-weight:700; }
  .today-title {
    align-self:flex-start; font-family:'Cinzel',Georgia,serif; font-size:42px; font-weight:700; line-height:1.05;
    margin:0; padding:18px 28px; color:#fff;
    white-space:nowrap; letter-spacing:-1px;
    border:1px solid color-mix(in srgb,var(--gold) 56%,transparent); border-radius:18px;
    background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 18%,transparent),rgba(255,255,255,.025));
    box-shadow:inset 5px 0 0 var(--gold),0 12px 30px rgba(0,0,0,.28);
    text-shadow:0 4px 18px rgba(0,0,0,.42);
  }
  .today-events {
    font-family:Georgia,serif; font-size:62px; line-height:1.08; color:#fff; font-weight:700;
    text-shadow:0 0 24px color-mix(in srgb,var(--gold) 34%,transparent),0 8px 22px rgba(0,0,0,.65);
  }
  .today-events .event-line { padding:13px 0 17px; border-bottom:1px solid rgba(255,255,255,.10); }
  .today-events .event-line:last-child { border-bottom:0; }
  .india-fact-card {
    display:none;
    max-width:720px; padding:18px 22px 20px; border:1px solid color-mix(in srgb,var(--pink2) 42%,transparent);
    border-left:5px solid var(--pink2); border-radius:5px 16px 16px 5px;
    background:linear-gradient(135deg,color-mix(in srgb,var(--pink) 12%,transparent),rgba(255,255,255,.025));
    color:#f1f1f1; font-family:Georgia,serif; font-size:22px; line-height:1.42;
    box-shadow:0 12px 28px rgba(0,0,0,.24);
  }
  body.india-independence-day .india-fact-card { display:block; }
  .fact-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .india-fact-card .quote-label { font-size:14px; letter-spacing:2.2px; }
  .fact-count { color:rgba(255,255,255,.58); font-family:"Segoe UI",Arial,sans-serif; font-size:11px; letter-spacing:1.5px; font-style:normal; }
  body.india-independence-day .today-title { border-color:rgba(255,153,51,.62); box-shadow:inset 5px 0 0 #ff9933,0 12px 30px rgba(0,0,0,.30); }
  body.india-independence-day .today-events { font-size:66px; }
  body.india-independence-day .india-fact-card { max-width:580px; border-left-color:#138808; }
  .next-wrap { display:flex; flex:1; flex-direction:column; justify-content:center; }
  .next-label { color:var(--pink2); font-size:20px; letter-spacing:3px; text-transform:uppercase; font-weight:700; }
  .next-event { font-family:Georgia,serif; font-size:56px; line-height:1.08; margin-top:18px; color:white; }
  .next-date { color:#d0d0d0; font-size:26px; line-height:1.35; margin-top:18px; }
  .countdown { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:22px; }
  .unit { background:#0b0b0b; border:1px solid rgba(246,201,69,.22); border-radius:12px; padding:12px 10px; min-width:0; text-align:center; }
  .num { display:block; font-size:32px; font-weight:800; font-variant-numeric:tabular-nums; }
  .lbl { display:block; margin-top:3px; font-size:11px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; }
  .upcoming {
    min-height:0; border:1px solid rgba(255,255,255,.09); border-radius:24px;
    background:rgba(15,15,15,.9); padding:26px 30px;
    display:flex; flex-direction:column;
  }
  body.india-independence-day .upcoming {
    border-color:rgba(19,136,8,.46);
    background:linear-gradient(160deg,rgba(255,153,51,.10),rgba(255,255,255,.025) 48%,rgba(19,136,8,.12)),#0f0f0f;
  }
  .section-head { display:flex; justify-content:space-between; align-items:end; margin-bottom:20px; }
  .section-title { font-family:Georgia,serif; font-size:29px; color:var(--cream); }
  .section-sub { font-size:12px; color:#8e8e8e; letter-spacing:1px; text-transform:uppercase; }
  .event-list { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:18px 20px; flex:1; overflow:hidden; }
  .event {
    border:1px solid rgba(255,255,255,.08); border-radius:18px;
    background:linear-gradient(135deg,#171717,#101010); padding:22px 26px;
    display:grid; grid-template-columns:100px 1fr; gap:20px; align-items:center;
    position:relative;
  }
  .event.soon { border-color:rgba(246,201,69,.42); box-shadow:inset 3px 0 0 var(--gold); }
  .event.progress { border-color:rgba(217,74,150,.38); }
  .event-date { text-align:center; border-right:1px solid rgba(255,255,255,.08); padding-right:16px; }
  .day { display:block; font-size:36px; font-weight:800; line-height:1; color:var(--gold2); }
  .month { display:block; font-size:13px; letter-spacing:2px; color:#aaa; text-transform:uppercase; margin-top:7px; }
  .dow { display:block; font-size:12px; color:#777; margin-top:4px; }
  .event-name { font-size:24px; line-height:1.25; font-weight:600; color:#f3f3f3; }
  .days { font-size:13px; margin-top:10px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
  .days strong { color:var(--gold); }
  .mini-bar { height:5px; background:#292929; border-radius:8px; margin-top:13px; overflow:hidden; }
  .mini-fill { height:100%; width:0%; background:linear-gradient(90deg,var(--pink),var(--gold)); transition:width .5s; }

  .quote { margin-top:8px; color:#bdbdbd; font-family:Georgia,serif; font-size:14px; line-height:1.35; font-style:italic; }
  .hero-quote { margin-top:16px; padding:14px 18px; border-left:3px solid var(--gold); background:rgba(246,201,69,.055); color:#d8d8d8; font-family:Georgia,serif; font-size:18px; line-height:1.42; font-style:italic; border-radius:0 10px 10px 0; }
  .thoughts { margin-top:42px; display:grid; gap:12px; }
  .thought { padding:22px 22px; border:1px solid rgba(255,255,255,.08); border-radius:16px; background:rgba(255,255,255,.025); color:#e0e0e0; font-family:Georgia,serif; font-size:24px; line-height:1.42; font-style:italic; }
  .thought.today-thought { border-left:3px solid var(--gold); }
  .thought.next-thought { border-left:3px solid var(--pink2); }
  .quote-label { color:var(--gold); font-family:"Segoe UI",Arial,sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; font-style:normal; margin-bottom:5px; }
  .empty {
    height:100%; display:flex; align-items:center; justify-content:center;
    color:#999; font-size:24px;
  }
  .footer {
    display:flex; justify-content:flex-start; align-items:center;
    color:#6f6f6f; font-size:13px; letter-spacing:1.3px; text-transform:uppercase;
  }
  .footer span:last-child { color:#8c8c8c; }
  .special { color:var(--pink2); }
  @media (max-width:1200px) {
    .screen { transform-origin:top left; transform:scale(calc(100vw / 1920)); width:1920px; height:1080px; }
  }
</style>
</head>

function parseDate(s) {
  const [d,m,y] = s.split('/').map(Number);
  return new Date(y, m-1, d, 0, 0, 0, 0);
}
function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtDate(d) {
  return new Intl.DateTimeFormat('en-NZ', {weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'Pacific/Auckland'}).format(d);
}
function fmtShort(d) {
  return new Intl.DateTimeFormat('en-NZ', {day:'numeric', month:'short', timeZone:'Pacific/Auckland'}).format(d);
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function aucklandNow() {
  // The browser/Yodeck device should be configured to Auckland time.
  return new Date();
}
function daysUntil(target, now) {
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const b = new Date(target.getFullYear(), target.getMonth(), target.getDate());
  return Math.round((b-a)/86400000);
}

const INDIA_FUN_FACTS = [
  'India became independent from British rule on 15 August 1947.',
  'The Indian national flag was designed by Pingali Venkayya and adopted on 22 July 1947.',
  'The navy-blue Ashoka Chakra at the centre of the flag has 24 spokes.',
  'Jawaharlal Nehru delivered the historic “Tryst with Destiny” speech as independence arrived.',
  'Every Independence Day, India’s Prime Minister addresses the nation from Delhi’s Red Fort.',
  'The Ashoka Chakra is inspired by the Dharma Chakra on the Lion Capital of Ashoka at Sarnath.',
  'India’s national flag is affectionately known as the Tiranga, meaning “tricolour”.',
  'The official proportion of India’s national flag is two units high for every three units wide.',
  '“Jana Gana Mana” was formally adopted as India’s national anthem on 24 January 1950.',
  'Independence Day celebrations across India include flag-hoisting ceremonies, parades and cultural programmes.'
];

function render() {
  const now = aucklandNow();
  const today = dateKey(now);
  const rotatingThemes = ['theme-amber','theme-royal','theme-lotus','theme-teal'];
  document.body.classList.remove('india-independence-day', ...rotatingThemes);
  if (today === '2026-08-15') {
    document.body.classList.add('india-independence-day');
  } else {
    const themeIndex = [...today].reduce((sum,ch) => sum + ch.charCodeAt(0), 0) % rotatingThemes.length;
    document.body.classList.add(rotatingThemes[themeIndex]);
  }
  const parsed = EVENTS.map(e => ({...e, dt:parseDate(e.date)})).sort((a,b)=>a.dt-b.dt);

  const todayEvents = parsed.filter(e => dateKey(e.dt) === today);
  const future = parsed.filter(e => e.dt > new Date(now.getFullYear(), now.getMonth(), now.getDate()));
  const next = future[0];

  document.getElementById('clock').textContent =
    new Intl.DateTimeFormat('en-NZ', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true, timeZone:'Pacific/Auckland'}).format(now);
  document.getElementById('date').textContent = fmtDate(now);

  if (todayEvents.length) {
    document.getElementById('todayTitle').textContent = 'Today at the Mandir';
    document.getElementById('todayEvents').innerHTML = todayEvents.map(e =>
      '<div class="event-line">' + escapeHtml(e.event) + '</div>'
    ).join('');
  } else {
    document.getElementById('todayTitle').textContent = 'No events listed today';
    document.getElementById('todayEvents').innerHTML = '<div class="event-line">Enjoy a blessed day of satsang and seva.</div>';
  }

  if (today === '2026-08-15') {
    const factIndex = Math.floor(now.getTime() / 10000) % INDIA_FUN_FACTS.length;
    document.getElementById('factText').textContent = INDIA_FUN_FACTS[factIndex];
    document.getElementById('factCount').textContent = (factIndex + 1) + ' / ' + INDIA_FUN_FACTS.length;
  }

  if (next) {
    const d = daysUntil(next.dt, now);
    document.getElementById('nextEvent').textContent = next.event;
    document.getElementById('nextDate').textContent = fmtDate(next.dt) + (d === 1 ? ' • Tomorrow' : ' • In ' + d + ' days');
  }
}

render();
setInterval(render, 1000);
