name: Refresh Yodeck Display

on:
  push:
    branches:
      - main

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Push update to Yodeck
        run: |
          curl -X POST https://app.yodeck.com/api/v1/screens/29daa684-62ce-497b-9b16-99e51ed30b16/push/ \
            -H "Authorization: Token ${{ secrets.YODECK_API_KEY }}" \
            -H "Content-Type: application/json"
