name: Update Yodeck Webpage Media & Push

on:
  push:
    branches:
      - main

jobs:
  update-media:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages deployment propagation
        run: |
          echo "Waiting 20 seconds for GitHub Pages CDN update..."
          sleep 20

      - name: Patch Yodeck Media with Cache-Busting URL
        env:
          YODECK_API_KEY: ${{ secrets.YODECK_API_KEY }}
          MEDIA_ID: "35372205"
        run: |
          if [ -z "$YODECK_API_KEY" ]; then
            echo "ERROR: YODECK_API_KEY is empty. Check your GitHub repository secrets."
            exit 1
          fi

          CACHE_BUSTER="${{ github.sha }}-$(date +%s)"
          NEW_URL="https://ssmbauckland.github.io/announcements-tv/?cb=${CACHE_BUSTER}"

          echo "Updating media to: $NEW_URL"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH "https://app.yodeck.com/api/v2/media/${MEDIA_ID}" \
            -H "Authorization: Token ${YODECK_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"arguments\": {
                \"play_from_url\": \"${NEW_URL}\"
              }
            }")

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

          echo "Media patch status: $HTTP_STATUS"
          echo "Media patch body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Failed to patch Yodeck media item."
            exit 1
          fi

      - name: Push Changes to Screens
        env:
          YODECK_API_KEY: ${{ secrets.YODECK_API_KEY }}
        run: |
          echo "Pushing changes to Yodeck screens..."
          
          # Delay a brief moment so the updated media metadata commits
          sleep 3

          PUSH_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://app.yodeck.com/api/v2/screens/push" \
            -H "Authorization: Token ${YODECK_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{}")

          PUSH_BODY=$(echo "$PUSH_RESPONSE" | sed '$d')
          PUSH_STATUS=$(echo "$PUSH_RESPONSE" | tail -n1)

          echo "Push status: $PUSH_STATUS"
          echo "Push body: $PUSH_BODY"

          if [ "$PUSH_STATUS" -lt 200 ] || [ "$PUSH_STATUS" -ge 300 ]; then
            echo "Failed to push to screens."
            exit 1
          fi
