name: Weekly calendar sync

# Adds new events from the Bhuj Mandir Google Calendar to the TV display.
# Runs every Monday at 6:00 am New Zealand time (Sunday 17:00 UTC; 5:00 am during NZ standard time),
# and can be run any time from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: '0 17 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add new calendar events
        run: python3 scripts/sync_calendar.py

      - name: Commit and push
        id: commit
        run: |
          if git diff --quiet; then
            echo "No new events."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "calendar-sync[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html CHANGELOG.md
          git commit -m "Calendar sync: add new events from the Bhuj Mandir calendar"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the website
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; it will build on the next push."

  refresh-screens:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/refresh-yodeck.yml
    secrets:
      YODECK_API_KEY: ${{ secrets.YODECK_API_KEY }}
